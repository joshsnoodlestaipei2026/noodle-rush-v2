<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拌麵出餐挑戰 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Silkscreen:wght@400;700&display=swap">
<style>
:root{
  --paper:#eef0ec; --card:#fbfbf8; --ink:#22304a; --soft:#5f6b80; --line:#c3cbd8;
  --brand:#405880; --deep:#2b3d60; --steel:#d9dee6; --steel-2:#c4ccd7;
  --good:#4d7a52; --bad:#b4523c; --gold:#c39638;
  --serif:"Silkscreen","Noto Serif TC","Songti TC","PMingLiu",serif;
  --pix:"Silkscreen","Noto Sans TC",monospace;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
svg{image-rendering:pixelated}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#app{height:100vh;height:calc(var(--vh,1vh)*100);max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));gap:8px}

/* 開始與選角色 */
.intro,.choose{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;padding:12px}
.intro h1{font-family:var(--serif);font-weight:900;font-size:clamp(30px,9vw,40px);letter-spacing:.12em;color:var(--deep);margin:0}
.intro .brand,.choose .brand{font-family:var(--serif);letter-spacing:.4em;color:var(--brand);font-size:14px}
.intro p{margin:0;color:var(--soft);line-height:1.7;font-size:16px;max-width:340px}
.howto{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:8px;text-align:left;font-size:16px;max-width:340px;width:100%}
.howto li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.howto b{width:26px;height:26px;flex:none;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px}
.choose h2{font-family:var(--serif);font-weight:900;font-size:26px;letter-spacing:.08em;color:var(--deep);margin:0}
.choose .sub{margin:0;color:var(--soft);font-size:15px}
.avs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:360px}
.av{background:var(--card);border:2px solid #8e99aa;box-shadow:3px 3px 0 rgba(43,61,96,.25);padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.av.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand),3px 3px 0 rgba(43,61,96,.25)}
.avbox{width:100px;height:100px;display:block}
.avbox svg,.av svg{width:100%;height:100%;display:block}
.avname{font-size:15px;color:var(--ink);font-weight:700}
.primary{background:var(--brand);color:#fff;font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:.3em;padding:14px 0;width:min(100%,300px);border-radius:0;border:2px solid var(--deep);box-shadow:4px 4px 0 var(--deep)}
.primary:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--deep)}
.best{font-size:14px;color:var(--soft);font-variant-numeric:tabular-nums;min-height:18px}
.ghostbtn{font-size:15px;color:var(--brand);border:1px solid var(--brand);border-radius:999px;padding:6px 18px}

/* HUD */
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:end;font-variant-numeric:tabular-nums;padding:0 4px}
.hud .lbl{font-size:12.5px;letter-spacing:.14em;color:var(--soft)}
.hud .val{font-family:var(--pix);font-weight:700;font-size:25px;color:var(--deep);line-height:1.1}
.hud .r{text-align:right}
.hud .clock.low .val{color:var(--bad)}
.stagebar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--soft);padding:0 4px;min-height:20px}
.tip{background:var(--card);border:2px dashed var(--brand);border-radius:0;padding:7px 10px;font-size:16px;color:var(--deep);text-align:center;min-height:40px;display:flex;align-items:center;justify-content:center;line-height:1.4}

/* 出餐台 */
.pass{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.pass.one{grid-template-columns:1fr}
.pass.one .slot{max-width:none}
.slot{position:relative;background:var(--card);border:2px solid var(--deep);border-radius:0;box-shadow:4px 4px 0 rgba(43,61,96,.35);padding:6px 6px 8px;display:flex;flex-direction:column;align-items:stretch;min-width:0;transition:border-color .2s,box-shadow .2s}
.slot.over{border-color:var(--brand);box-shadow:0 0 0 3px rgba(64,88,128,.18)}
.slot.empty{opacity:.55;border-style:dashed}
.slot.ready{border-color:var(--good);box-shadow:0 0 0 3px rgba(77,122,82,.2)}
.slot svg.dish{width:100%;height:auto;display:block;max-height:30vh;margin:0 auto}
.slot .ticket{font-size:14px;color:var(--soft);display:flex;justify-content:space-between;gap:6px;padding:0 2px}
.slot .name{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--ink);line-height:1.3;padding:2px 2px 0;min-height:44px}
.slot .recipe{display:flex;flex-wrap:wrap;gap:4px;padding:2px;min-height:26px}
.chip{font-size:13px;padding:2px 7px;border-radius:999px;border:1px dashed var(--line);color:var(--soft)}
.chip.ok{border-style:solid;border-color:var(--good);color:var(--good)}
.chip.ok::before{content:"✓ "}
.bar{height:6px;border-radius:5px;background:var(--steel);overflow:hidden;margin:4px 2px 0}
.bar i{display:block;height:100%;width:100%;background:var(--brand);transform-origin:left}
.bar.warn i{background:var(--bad)}
.serve{margin-top:6px;width:100%;padding:10px 0;border-radius:10px;background:var(--steel);color:var(--soft);font-family:var(--serif);font-weight:900;letter-spacing:.25em;font-size:17px;opacity:.6}
.slot.ready .serve{background:var(--good);color:#fff;opacity:1;animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.12)}}
.slot.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.float{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-family:var(--serif);font-weight:900;font-size:32px;color:var(--deep);pointer-events:none;animation:rise .9s ease-out forwards;z-index:4;text-shadow:0 2px 0 var(--paper)}
@keyframes rise{to{transform:translate(-50%,-50px);opacity:0}}

/* 廚房區 */
.kitchen{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:6px;overflow-y:auto;background:linear-gradient(#dfe4eb,#cfd6e0);border-radius:0;padding:8px;border:2px solid var(--deep)}
.row-title{font-size:13.5px;letter-spacing:.12em;color:var(--soft);display:flex;justify-content:space-between;align-items:center;gap:8px}
.row-title span+span{font-size:12.5px;letter-spacing:0}
.noodles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pack{background:var(--card);border:2px solid #8e99aa;border-radius:0;box-shadow:2px 2px 0 rgba(43,61,96,.25);padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:none;min-width:0}
.pack svg{width:42px;height:42px;pointer-events:none}
.pack span{font-size:12.5px;line-height:1.2;text-align:center;color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:5px}
.tab{flex:none;font-size:14.5px;padding:5px 10px;border-radius:0;border:1px solid var(--brand);color:var(--brand);background:transparent;position:relative}
.tab[aria-pressed="true"]{background:var(--brand);color:#fff}
.tab.need::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--gold);border:1.5px solid #fff}
.tab.locked{opacity:.35}
.fridge{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;align-content:start;flex:1;min-height:0;overflow-y:auto}
.ing{background:var(--card);border:2px solid #8e99aa;border-radius:0;box-shadow:2px 2px 0 rgba(43,61,96,.2);padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:none;min-width:0;position:relative}
.ing svg{width:34px;height:34px;pointer-events:none}
.ing span{font-size:12.5px;line-height:1.15;text-align:center;word-break:break-all}
.ing .tag{font-size:11.5px;color:var(--gold);font-weight:700}

/* 廚師工作區（畫面最下面） */
.worker{flex:none;display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--deep);padding:6px 10px 6px 6px;box-shadow:3px 3px 0 rgba(43,61,96,.3)}
.wkav{width:60px;height:60px;flex:none;animation:bob 1.2s steps(2) infinite}
.wkav svg{width:100%;height:100%;display:block}
@keyframes bob{50%{transform:translateY(-2px)}}
.wkbub{flex:1;min-width:0;font-size:16px;color:var(--deep);background:#fff;border:2px solid var(--deep);padding:8px 12px;min-height:46px;display:flex;align-items:center;line-height:1.35}

/* 炙燒／油封的火焰動畫 */
.fx{position:fixed;width:64px;height:64px;transform:translate(-50%,-50%);pointer-events:none;z-index:55}
.fx i{position:absolute;bottom:0;left:6px;width:14px;height:14px;background:#9aa0a8;box-shadow:0 0 0 2px #d6d9de;animation:puff .5s ease-out forwards}
.fx i:nth-child(2){left:26px;animation-delay:.12s}
.fx i:nth-child(3){left:14px;animation-delay:.22s}
.fx.steam i{background:#ffffff;box-shadow:0 0 0 2px #cfd8e0}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.95}100%{transform:translateY(-46px) scale(1.6);opacity:0}}

/* 拖曳中的影子 */
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;transform:translate(-50%,-70%);opacity:.95;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.ghost svg{width:52px;height:52px;display:block}
.ghost span{display:block;font-size:13px;background:var(--deep);color:#fff;border-radius:6px;padding:1px 6px;margin-top:2px;white-space:nowrap;text-align:center}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--deep);color:#fff;font-size:16px;padding:9px 16px;border-radius:0;border:2px solid #fff;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.toast.ok{background:var(--good)}
[data-src]{cursor:grab;-webkit-touch-callout:none}
[data-src]:active{cursor:grabbing}

/* 結算 */
.result{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.stars{display:flex;gap:6px}
.stars svg{width:38px;height:38px}
.rank{font-family:var(--serif);font-weight:900;font-size:30px;color:var(--deep);letter-spacing:.08em;margin:0}
.big{font-family:var(--pix);font-weight:900;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:340px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.stats div+div{border-left:1px dotted var(--line)}
.stats b{display:block;font-family:var(--pix);font-size:22px;font-variant-numeric:tabular-nums;color:var(--deep)}
.stats span{font-size:13px;color:var(--soft)}
.newbest{color:var(--gold);font-weight:700;font-size:15px;letter-spacing:.1em}

/* 手機較矮的螢幕：縮小出餐台，讓冰箱與廚師還看得到 */
@media (max-height:760px), (max-width:899px) and (max-height:900px){
  .row-title{display:none}
  .stagebar{display:none}
  .noodles{gap:4px}
  .pack{padding:2px 1px 3px}
  .pack span{font-size:11px}
  .pack svg{width:34px;height:34px}
  .slot svg.dish{max-height:15vh}
  .slot .ticket{font-size:13px}
  .chip{font-size:12px;padding:1px 5px}
  .slot .name{min-height:0;font-size:15px}
  .slot .recipe{min-height:0}
  .serve{margin-top:4px;padding:7px 0;font-size:15px}
  .tip{min-height:32px;padding:4px 8px;font-size:14.5px}
  .hud .val{font-size:20px}
  .kitchen{padding:5px;gap:4px}
  .ing svg{width:28px;height:28px}
  .ing span{font-size:11.5px}
  .wkav{width:60px;height:60px}
  .wkbub{font-size:14.5px;min-height:38px;padding:5px 10px}
  .worker{padding:4px 8px 4px 4px}
  .avbox{width:80px;height:80px}
}

/* 手機較高的螢幕：出餐台與冰箱可以大一點 */
@media (max-width:899px) and (min-height:800px){
  .kitchen{flex:1;gap:10px;padding:10px}
  .ing svg{width:40px;height:40px}
  .ing span{font-size:13px}
  .pack svg{width:50px;height:50px}
  .pack span{font-size:13px}
  .tab{font-size:15.5px;padding:6px 12px}
  .fridge{gap:7px}
}

/* 電腦版：左邊出餐台、右邊廚房，整個畫面不用捲動 */
@media (min-width:900px){
  #app{max-width:1200px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:auto auto auto minmax(0,1fr) auto;gap:10px 22px;padding:18px 24px}
  .hud{grid-column:1/-1;grid-row:1}
  .stagebar{grid-column:1/-1;grid-row:2}
  .tip{grid-column:1/-1;grid-row:3}
  .intro,.choose,.result{grid-column:1/-1;grid-row:1/-1}
  .pass{grid-column:1;grid-row:4;grid-template-columns:1fr;min-height:0;overflow-y:auto;align-content:start;padding:2px}
  .pass.one{grid-template-columns:1fr}
  .slot svg.dish{max-height:260px}
  .worker{grid-column:1;grid-row:5}
  .kitchen{grid-column:2;grid-row:4/6;min-height:0;overflow-y:auto;padding:14px;gap:12px}
  .fridge{grid-template-columns:repeat(7,1fr);gap:8px}
  .ing svg{width:44px;height:44px}
  .ing span{font-size:13.5px}
  .pack svg{width:52px;height:52px}
  .pack span{font-size:13.5px}
  .tab{font-size:15.5px;padding:6px 12px}
  .hud .val{font-size:28px}
  .slot .name{font-size:19px}
  .slot .chip{font-size:14px}
  .wkav{width:80px;height:80px}
  .wkbub{font-size:18px}
  .avbox{width:120px;height:120px}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
// 像素風繪製：用遮罩自動上陰影，產生 16×16 食材圖、64×64 出餐容器與 20×20 廚師小人
(function () {
  const D = window.DATA;

  // ---------- 小工具 ----------
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function mk(w, h) { return Array.from({ length: h }, () => new Array(w).fill(0)); }
  function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function rgb2hex(c) { return "#" + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join(""); }
  function mix(h, t, target) { const a = hex2rgb(h), b = hex2rgb(target); return rgb2hex(a.map((v, i) => v + (b[i] - v) * t)); }
  function palFromHex(hex) {
    return { 1: mix(hex, 0.55, "#000000"), 2: hex, 3: mix(hex, 0.45, "#ffffff"), 4: mix(hex, 0.25, "#000000"), 5: mix(hex, 0.7, "#ffffff") };
  }

  // ---------- 形狀（遮罩）----------
  function ell(m, cx, cy, rx, ry, v, ang) {
    v = v === undefined ? 1 : v; ang = ang || 0;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    for (let y = 0; y < m.length; y++) for (let x = 0; x < m[0].length; x++) {
      const dx = x + 0.5 - cx, dy = y + 0.5 - cy;
      const u = dx * ca + dy * sa, w = -dx * sa + dy * ca;
      if ((u * u) / (rx * rx) + (w * w) / (ry * ry) <= 1) m[y][x] = v;
    }
  }
  function rrect(m, x0, y0, x1, y1, r, v) {
    v = v === undefined ? 1 : v;
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      const cx = Math.min(Math.max(x + 0.5, x0 + r), x1 - r), cy = Math.min(Math.max(y + 0.5, y0 + r), y1 - r);
      if ((x + 0.5 - cx) ** 2 + (y + 0.5 - cy) ** 2 <= r * r) m[y][x] = v;
    }
  }
  function seg(m, x0, y0, x1, y1, th, v) {
    v = v === undefined ? 1 : v;
    const minx = Math.floor(Math.min(x0, x1) - th), maxx = Math.ceil(Math.max(x0, x1) + th);
    const miny = Math.floor(Math.min(y0, y1) - th), maxy = Math.ceil(Math.max(y0, y1) + th);
    const dx = x1 - x0, dy = y1 - y0, L2 = dx * dx + dy * dy || 1;
    for (let y = miny; y <= maxy; y++) for (let x = minx; x <= maxx; x++) {
      if (y < 0 || x < 0 || y >= m.length || x >= m[0].length) continue;
      const px = x + 0.5, py = y + 0.5;
      let t = ((px - x0) * dx + (py - y0) * dy) / L2; t = Math.max(0, Math.min(1, t));
      const qx = x0 + dx * t - px, qy = y0 + dy * t - py;
      if (qx * qx + qy * qy <= (th / 2) * (th / 2)) m[y][x] = v;
    }
  }
  function curve(m, pts, th, v) { for (let i = 0; i < pts.length - 1; i++) seg(m, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], th, v); }
  function ring(m, cx, cy, r1, r2, v) {
    for (let y = 0; y < m.length; y++) for (let x = 0; x < m[0].length; x++) {
      const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy);
      if (d <= r2 && d >= r1) m[y][x] = v === undefined ? 1 : v;
    }
  }

  // ---------- 上陰影：外框深色、左上亮、右下暗 ----------
  // 回傳索引格：0 空白、1 外框、2 本色、3 亮面、4 暗面、5 強調
  function shade(m, acc) {
    const H = m.length, W = m[0].length;
    let x0 = W, y0 = H, x1 = -1, y1 = -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (m[y][x]) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    const out = mk(W, H);
    if (x1 < 0) return out;
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!m[y][x]) continue;
      const edge = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => {
        const yy = y + dy, xx = x + dx;
        return yy < 0 || xx < 0 || yy >= H || xx >= W || !m[yy][xx];
      });
      if (edge) { out[y][x] = 1; continue; }
      const s = (x - x0) / bw + (y - y0) / bh;
      let c = s < 0.75 ? 3 : s > 1.25 ? 4 : 2;
      if (acc && acc[y][x]) c = 5;
      out[y][x] = c;
    }
    return out;
  }

  // ---------- 色盤 ----------
  const PAL = {
    egg: { 1: "#6b4a2a", 2: "#fffaf0", 3: "#ffffff", 4: "#e8dcc0", 5: "#f29a2e" },
    green: { 1: "#2e5a22", 2: "#5ea03e", 3: "#9ad46a", 4: "#3f7a2c", 5: "#c8f08a" },
    lightgreen: { 1: "#4f7d2f", 2: "#9fd16a", 3: "#d7f2a8", 4: "#6ea244", 5: "#ffffff" },
    darkgreen: { 1: "#1d3a17", 2: "#3c7a2a", 3: "#6aa84a", 4: "#2a5a1e", 5: "#a6d46c" },
    brown: { 1: "#3a1f10", 2: "#8b4a2a", 3: "#b97045", 4: "#5e2e16", 5: "#e0b070" },
    redmeat: { 1: "#4a1414", 2: "#b8443a", 3: "#e27a6a", 4: "#7c2420", 5: "#f2c6a0" },
    pink: { 1: "#6a3a40", 2: "#e7a3a0", 3: "#f9d3cf", 4: "#c0716e", 5: "#ffffff" },
    cream: { 1: "#8a7a5a", 2: "#f1e4c4", 3: "#fffaf0", 4: "#d6c59b", 5: "#c0a070" },
    white: { 1: "#9aa3ad", 2: "#f4f6f8", 3: "#ffffff", 4: "#d7dde3", 5: "#b9c3cd" },
    yellow: { 1: "#8a6418", 2: "#f1c24a", 3: "#ffe68a", 4: "#d89b2c", 5: "#fff3c4" },
    orange: { 1: "#7a3a12", 2: "#e88a3a", 3: "#ffb878", 4: "#b8561e", 5: "#ffd29a" },
    dark: { 1: "#15100d", 2: "#3d3430", 3: "#6b5d55", 4: "#241c19", 5: "#8f7a6a" },
    black: { 1: "#050505", 2: "#2a2a2e", 3: "#55555c", 4: "#101014", 5: "#7a7a80" },
    tan: { 1: "#6e5230", 2: "#c9a26a", 3: "#eccf98", 4: "#9d7a48", 5: "#6e5230" },
    sauce: { 1: "#3d1f0c", 2: "#a8642a", 3: "#d8985a", 4: "#6e3a16", 5: "#f0c080" },
    steel: { 1: "#4d5763", 2: "#b9c1cc", 3: "#e6ebf1", 4: "#8a94a3", 5: "#f0a050" },
    flame: { 1: "#8a2a10", 2: "#f28a28", 3: "#ffd46a", 4: "#d24a18", 5: "#fff1a8" },
    saucer: { 1: "#7a6a5a", 2: "#f7f7f2", 3: "#ffffff", 4: "#d6d9dc", 5: "#a8642a" }
  };

  // ---------- 食材形狀 ----------
  const SHAPE = {
    egg(m, a) { ell(m, 8, 8.5, 6.2, 5.2); ell(a, 9.2, 8.6, 2.3, 2.3); },
    leaf(m, a) { ell(m, 8, 7.5, 6.2, 2.8, 1, -0.7); seg(m, 3, 14, 7, 9, 1.4); seg(a, 5, 11, 11, 4, 0.8); },
    sprig(m, a) {
      ell(m, 5.5, 8, 4.2, 1.8, 1, -0.9); ell(m, 10.5, 7, 4.2, 1.8, 1, 0.9); ell(m, 8, 11.5, 4, 1.6, 1, 0.1);
      seg(m, 8, 15, 8, 9, 1.2); seg(a, 4, 7, 6, 9, 0.6); seg(a, 11, 6, 9, 8, 0.6);
    },
    curl(m, a) {
      curve(m, [[3, 4], [7, 2.5], [11, 6], [7, 10], [4, 12], [10, 14]], 3);
      for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) if (m[y][x] && (x + y) % 4 === 0) a[y][x] = 1;
    },
    slab(m, a) {
      rrect(m, 2, 3, 14, 12, 2.5);
      for (let x = 4; x < 13; x++) { if (x % 3 !== 0) { a[6][x] = 1; a[9][x] = 1; } }
    },
    leg(m, a) { ell(m, 6.2, 10, 4.2, 3.7); seg(m, 9, 7, 12.5, 3.5, 2.4); ell(m, 13.2, 2.8, 2, 2); ell(a, 13.2, 2.8, 1.2, 1.2); },
    strand(m, a) {
      for (let k = 0; k < 4; k++) {
        const y0 = 3 + k * 3;
        curve(m, [[1, y0], [4, y0 - 2], [8, y0 + 1], [12, y0 - 2], [15, y0]], 1.8);
      }
      for (let x = 2; x < 14; x += 4) a[5][x] = 1;
    },
    shred(m, a) {
      for (let k = 0; k < 5; k++) {
        const x0 = 2 + k * 3;
        curve(m, [[x0, 1], [x0 + 1.6, 5], [x0, 9], [x0 + 1.6, 13], [x0, 15]], 1.7);
        a[6][x0] = 1;
      }
    },
    pile(m, a, seed) {
      const r = rng(seed || 7);
      for (let k = 0; k < 11; k++) {
        const cx = 2.5 + r() * 11, cy = 2.5 + r() * 11, rr = 1.1 + r() * 0.7;
        ell(m, cx, cy, rr, rr);
        if (r() < 0.3) ell(a, cx, cy, 0.5, 0.5);
      }
    },
    slice(m, a) { ring(m, 8, 8, 3.8, 6.4); ell(m, 8, 8, 3.2, 3.2, 0); ell(a, 8, 8, 1.2, 1.2); },
    stick(m, a) { seg(m, 4, 15, 5, 2, 2); seg(m, 8, 15, 9, 1, 2); seg(m, 12, 15, 11, 3, 2); seg(a, 5, 4, 6, 4, 0.9); },
    cluster(m, a) {
      ell(m, 5, 10, 3, 3); ell(m, 10, 8, 3.3, 3.3); ell(m, 7, 5, 2.6, 2.6); ell(m, 11.5, 12.5, 2.6, 2.6); ell(m, 4, 5.5, 2.2, 2.2);
      ell(a, 10, 7, 1, 1); ell(a, 5, 9, 0.8, 0.8);
    },
    blob(m, a) {
      ell(m, 8, 8.5, 5.8, 5); ell(m, 3, 7, 2, 2); ell(m, 13, 7, 2, 2); ell(m, 8, 3, 2.2, 2);
      ell(a, 6, 7, 1, 1); ell(a, 10, 10, 0.8, 0.8);
    },
    drop(m, a) {
      ell(m, 8, 10.5, 5, 4.2);
      for (let y = 3; y < 11; y++) { const hw = ((y - 3) / 8) * 4.6; for (let x = 0; x < 16; x++) if (Math.abs(x + 0.5 - 8) <= hw) m[y][x] = 1; }
      a[8][5] = 1; a[7][5] = 1;
    },
    ball(m, a) { ell(m, 8, 8, 6, 6); ell(a, 5.5, 5.5, 1.5, 1.5); },
    cube(m, a) { rrect(m, 3, 3, 13, 13, 1); for (let x = 4; x < 12; x++) { a[4][x] = 1; } },
    wok(m, a) {
      ell(m, 7, 8, 6.5, 4.5); for (let y = 0; y < 8; y++) for (let x = 0; x < 16; x++) m[y][x] = 0;
      rrect(m, 2, 7, 13, 9, 0.5); rrect(m, 12, 6, 15, 8, 0.5); rrect(m, 13, 6, 16, 9, 0.5);
      ell(a, 7, 10, 3, 1);
    },
    oven(m, a) { rrect(m, 1, 2, 15, 14, 1); ell(a, 8, 8, 3, 3); a[4][13] = 1; a[7][13] = 1; },
    stove(m, a) { rrect(m, 1, 11, 15, 14, 1); ell(m, 8, 7.5, 3.6, 4.8); ell(a, 8, 8.5, 1.8, 2.8); },
    saucer(m, a) { ell(m, 8, 8.5, 6.5, 4.8); ell(a, 8, 8.5, 3.6, 2.4); }
  };

  // 食材 → [形狀, 色盤]
  const SPR = {
    egg: ["egg", "egg"], kongxin: ["sprig", "lightgreen"], woodear: ["blob", "dark"], chayote: ["leaf", "darkgreen"],
    cordyceps: ["stick", "orange"], sorghum: ["pile", "brown"], karasumi: ["pile", "orange"], chicken: ["strand", "cream"],
    garlicKoji: ["ball", "cream"], barley: ["pile", "cream"], chervil: ["sprig", "green"], arugula: ["leaf", "green"],
    crispyRice: ["pile", "white"], wagyu: ["slab", "brown"], squid: ["curl", "pink"], kailan: ["sprig", "darkgreen"],
    cauli: ["cluster", "cream"], duck: ["shred", "brown"], pork: ["slab", "redmeat"], jowl: ["slab", "pink"],
    tripe: ["curl", "cream"], chickenleg: ["leg", "brown"], kombu: ["curl", "black"], buckwheat: ["pile", "tan"],
    gingerSoy: ["drop", "sauce"], sugar: ["pile", "white"], miso: ["drop", "yellow"], sesame: ["pile", "cream"],
    sauce: ["drop", "sauce"], nuts: ["pile", "tan"], garlicSoy: ["saucer", "saucer"], lettuce: ["leaf", "lightgreen"],
    bamboo: ["slice", "yellow"], greenBean: ["stick", "green"], tremella: ["blob", "white"], puree: ["drop", "orange"],
    brownSugar: ["cube", "brown"], nitroBall: ["ball", "white"], broth1: ["drop", "yellow"], broth2: ["drop", "cream"],
    nostoc: ["blob", "brown"], cucumber: ["slice", "green"], tomato: ["ball", "redmeat"], okra: ["stick", "darkgreen"],
    cabbage: ["leaf", "redmeat"], tofu: ["cube", "cream"],
    wok: ["wok", "black"], oven: ["oven", "steel"], stove: ["stove", "flame"], ball: ["ball", "white"], round: ["ball", "white"]
  };

  // 產生 16×16 顏色格（null 為透明）
  const cache = {};
  function spriteGrid(key) {
    const def = SPR[key] || SPR.round;
    const m = mk(16, 16), a = mk(16, 16);
    SHAPE[def[0]](m, a, key.length * 13 + 5);
    const idx = shade(m, a), pal = PAL[def[1]];
    return idx.map(row => row.map(v => (v ? pal[v] : null)));
  }
  function spriteFor(key) { return cache["s:" + key] || (cache["s:" + key] = spriteGrid(key)); }

  // 把顏色格變成 SVG（同色的橫列合併）
  function toSVG(g, label) {
    const H = g.length, W = g[0].length;
    let s = "";
    for (let y = 0; y < H; y++) {
      let x = 0;
      while (x < W) {
        const c = g[y][x];
        if (!c) { x++; continue; }
        let e = x + 1;
        while (e < W && g[y][e] === c) e++;
        s += `<rect x="${x}" y="${y}" width="${e - x}" height="1" fill="${c}"/>`;
        x = e;
      }
    }
    return `<svg viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges" role="img" aria-label="${label || ""}">${s}</svg>`;
  }

  function iconKey(id) {
    const ing = D.ING[id];
    return ing ? ing.icon : id;
  }

  // 圖示（16×16 像素）
  function icon(id, size) {
    const key = iconKey(id);
    const svg = cache["i:" + key] || (cache["i:" + key] = toSVG(spriteFor(key)));
    return svg.replace("<svg ", `<svg width="${size}" height="${size}" `);
  }

  // 麵條小包（麵櫃用）
  function packSVG(baseKey) {
    const b = D.BASES[baseKey];
    const pal = palFromHex(b.color);
    const m = mk(16, 16), a = mk(16, 16);
    for (let k = 0; k < 3; k++) {
      const y0 = 4 + k * 4;
      curve(m, [[1, y0], [4, y0 - 2], [8, y0 + 1], [12, y0 - 2], [15, y0]], 2);
    }
    for (let x = 2; x < 14; x += 5) a[6][x] = 1;
    const idx = shade(m, a);
    const g = idx.map(row => row.map(v => (v ? pal[v] : null)));
    return toSVG(g, b.zh).replace("<svg ", `<svg width="40" height="40" `);
  }

  // ---------- 出餐容器（64×64）----------
  function place(g, sprite, ox, oy) {
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      const c = sprite[y][x];
      const gy = oy + y, gx = ox + x;
      if (c && gy >= 0 && gx >= 0 && gy < 64 && gx < 64) g[gy][gx] = c;
    }
  }

  function bowlGrid(dish, have, base, broth) {
    const g = Array.from({ length: 64 }, () => new Array(64).fill(null));
    const isSoup = dish.cat === "soup";
    for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) {
      const d = Math.hypot(x + 0.5 - 32, y + 0.5 - 32);
      const sd = Math.hypot(x + 0.5 - 34, y + 0.5 - 35);
      if (sd <= 30.5 && d > 30) g[y][x] = "#22304a44";
      if (d <= 30) {
        if (d > 27.5) g[y][x] = "#2f3b52";
        else if (d > 25) g[y][x] = "#7d8ba6";
        else if (d > 23) g[y][x] = "#2f3b52";
        else g[y][x] = isSoup ? (broth || "#e8d9a6") : "#f5f1e7";
      }
    }
    if (isSoup) {
      for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) {
        const d = Math.hypot(x + 0.5 - 32, y + 0.5 - 32);
        if (d <= 22 && d > 18 && (x + y) % 6 === 0) g[y][x] = "#fff6d6";
      }
    }
    if (!isSoup && base) {
      // 麵條：加了配料之後才變成綠色（有 turnGreen 的菜）
      const noodleHex = dish.turnGreen && have.length ? dish.turnGreen : D.BASES[base].color;
      const r = rng(dish.id.charCodeAt(1) * 31 + 9);
      const m = mk(64, 64), a = mk(64, 64);
      for (let k = 0; k < 12; k++) {
        const y0 = 32 + (r() - 0.5) * 38, amp = 3 + r() * 4, ph = r() * 6, fr = 0.3 + r() * 0.15;
        const pts = [];
        for (let x = 10; x <= 54; x += 2) pts.push([x, y0 + Math.sin(x * fr + ph) * amp]);
        curve(m, pts, 3.2);
      }
      for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) if (Math.hypot(x + 0.5 - 32, y + 0.5 - 32) > 21) m[y][x] = 0;
      for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) if (m[y][x] && (x * 7 + y * 3) % 11 === 0) a[y][x] = 1;
      const idx = shade(m, a), pal = palFromHex(noodleHex);
      for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) if (idx[y][x]) g[y][x] = pal[idx[y][x]];
    }
    const n = have.length;
    have.forEach((id, i) => {
      const sp = spriteFor(iconKey(id));
      let cx = 32, cy = 32;
      if (n > 1) { const ang = -Math.PI / 2 + (i / n) * Math.PI * 2; cx = 32 + Math.cos(ang) * 13; cy = 32 + Math.sin(ang) * 13; }
      place(g, sp, Math.round(cx - 8), Math.round(cy - 8));
    });
    return g;
  }

  function plateGrid(dish, have) {
    const g = Array.from({ length: 64 }, () => new Array(64).fill(null));
    const m = mk(64, 64), a = mk(64, 64);
    rrect(m, 3, 12, 61, 52, 6);
    rrect(a, 6, 15, 58, 49, 4);
    const idx = shade(m, null);
    for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) {
      if (!idx[y][x]) continue;
      g[y][x] = idx[y][x] === 1 ? "#2f3b52" : idx[y][x] === 3 ? "#c2cbda" : idx[y][x] === 4 ? "#6f7d97" : "#98a4bb";
    }
    const n = have.length;
    const pos = n <= 1 ? [[24, 24]] : n === 2 ? [[14, 24], [34, 24]] : [[8, 24], [24, 24], [40, 24]];
    have.forEach((id, i) => {
      const p = pos[i] || pos[pos.length - 1];
      place(g, spriteFor(iconKey(id)), p[0], p[1]);
    });
    return g;
  }

  function glassGrid(dish, have) {
    const g = Array.from({ length: 64 }, () => new Array(64).fill(null));
    for (let y = 4; y < 60; y++) {
      const half = 15 + ((y - 4) / 56) * -2;
      for (let x = 0; x < 64; x++) {
        if (Math.abs(x + 0.5 - 32) <= half) {
          const edge = Math.abs(x + 0.5 - 32) > half - 1.4 || y > 57;
          g[y][x] = edge ? "#7fa3b1" : y > 40 ? "#f7e9b8" : "#eef7f9";
        }
      }
    }
    const pos = [[17, 8], [33, 8], [17, 28], [33, 28]];
    have.forEach((id, i) => {
      const p = pos[i] || pos[pos.length - 1];
      place(g, spriteFor(iconKey(id)), p[0], p[1]);
    });
    return g;
  }

  const DISH_CACHE = {};
  // 公開：畫出一個出餐容器（有快取，避免每次都重算）
  function dishSVG(dish, have, base, broth) {
    const key = [dish.id, have.join(","), base || "", broth || ""].join("|");
    if (DISH_CACHE[key]) return DISH_CACHE[key];
    let g;
    if (dish.cat === "noodle" || dish.cat === "soup") g = bowlGrid(dish, have, base, broth);
    else if (dish.cat === "dessert") g = glassGrid(dish, have);
    else g = plateGrid(dish, have);
    const svg = toSVG(g, dish.zh).replace("<svg ", `<svg class="dish" `);
    if (Object.keys(DISH_CACHE).length > 300) for (const k in DISH_CACHE) delete DISH_CACHE[k];
    DISH_CACHE[key] = svg;
    return svg;
  }

  // ---------- 廚師與動物廚師（20×20；姿勢 0 站著、1 攪拌、2 舉手）----------
  const SHIRT = "#f5f5f3", BAND = "#c9ced6", PANTS = "#2e2b33", CHEEK = "#e8948e", OUT = "#22304a";
  const AVATARS = [
    { name: "阿明大廚", kind: "human", hair: "#5a3a1e", skin: "#dcb07a", hat: SHIRT, band: BAND, ponytail: true },
    { name: "小美大廚", kind: "human", hair: "#241a14", skin: "#f0c7a0", hat: SHIRT, band: "#c0453a", ponytail: false },
    { name: "小橘・貓", kind: "cat", hair: "#e09040", skin: "#f2b878", hat: SHIRT, band: BAND, inner: "#f2a0a0" },
    { name: "阿旺・狗", kind: "dog", hair: "#7a4a22", skin: "#e3b47e", hat: SHIRT, band: "#4a7ab0", patch: "#fbf6ea" },
    { name: "泡泡・天竺鼠", kind: "pig", hair: "#8a5a30", skin: "#e8c08a", hat: SHIRT, band: BAND, patch: "#fbf6ea" },
    { name: "料理鼠王", kind: "rat", hair: "#8e949c", skin: "#a9afb8", hat: "#e0b040", band: "#e0b040", inner: "#f5a0a0" }
  ];
  function chefGrid(av, pose) {
    const lab = mk(20, 20); // 1 衣 2 臉/毛 3 髮 4 帽 5 袖 6 五官 7 帽帶 8 腮紅 9 褲 10 耳內 11 金 12 白斑 13 耳
    const h = av.kind;
    rrect(lab, 4, 13, 16, 17, 2, 1);                 // 廚師服
    rrect(lab, 5, 17, 15, 20, 0, 9);                 // 褲子
    lab[14][7] = 6; lab[14][12] = 6; lab[16][7] = 6; lab[16][12] = 6; // 扣子
    seg(lab, 4.5, 14, 2.5, pose === 2 ? 8 : 17, 2, 5);                       // 左手
    seg(lab, 15.5, 14, pose === 1 ? 16.5 : pose === 2 ? 17 : 17.5, pose === 1 ? 9 : pose === 2 ? 8 : 17, 2, 5); // 右手
    if (h === "human") {
      rrect(lab, 4, 5, 16, 15, 2, 3);                // 長髮
      if (av.ponytail) rrect(lab, 15, 8, 18, 16, 1, 3);
    }
    if (h === "cat") { ell(lab, 4.5, 6, 1.8, 2.4, 2); ell(lab, 15.5, 6, 1.8, 2.4, 2); ell(lab, 4.6, 6.4, 0.9, 1.2, 10); ell(lab, 15.4, 6.4, 0.9, 1.2, 10); }
    if (h === "dog") { ell(lab, 3.8, 10, 1.8, 3.2, 13); ell(lab, 16.2, 10, 1.8, 3.2, 13); }
    if (h === "rat") { ell(lab, 4.5, 7, 3, 3, 2); ell(lab, 15.5, 7, 3, 3, 2); ell(lab, 4.5, 7, 1.7, 1.7, 10); ell(lab, 15.5, 7, 1.7, 1.7, 10); }
    ell(lab, 10, 9.5, 4.8, 4.4, 2);                  // 臉
    if (h === "pig") ell(lab, 13.6, 11.5, 2.4, 2, 12);
    if (h === "dog") { ell(lab, 10, 12.4, 2.6, 1.8, 12); lab[11][10] = 6; }
    if (h === "cat") lab[11][10] = 8;
    if (h === "rat") lab[12][10] = 8;
    lab[9][7] = 6; lab[9][12] = 6;                   // 眼睛
    lab[11][6] = 8; lab[11][13] = 8;                 // 腮紅
    if (h === "rat") {
      rrect(lab, 6, 2, 14, 5, 0, 11);                // 王冠
      lab[1][7] = 11; lab[1][10] = 11; lab[1][13] = 11;
    } else {
      ell(lab, 10, 3.2, 5.6, 3.2, 4);              // 廚師帽
      rrect(lab, 5, 5, 15, 7, 0, 7);             // 帽帶
    }
    const idx = shade(lab.map(r => r.map(v => (v ? 1 : 0))), null);
    const colorOf = { 1: SHIRT, 2: av.skin, 3: av.hair, 4: av.hat, 5: SHIRT, 7: av.band, 8: CHEEK, 9: PANTS, 10: av.inner || "#f0a0a0", 11: "#e0b040", 12: av.patch || "#fbf6ea", 13: av.hair };
    return lab.map((row, y) => row.map((v, x) => {
      const k = idx[y][x];
      if (!k) return null;
      if (v === 6 || k === 1) return OUT;
      return palFromHex(colorOf[v])[k];
    }));
  }
  const CHEF_CACHE = {};
  function chef(i, pose) {
    const key = i + ":" + pose;
    if (!CHEF_CACHE[key]) {
      const av = AVATARS[i] || AVATARS[0];
      CHEF_CACHE[key] = toSVG(chefGrid(av, pose), av.name).replace("<svg ", '<svg class="chef" ');
    }
    return CHEF_CACHE[key];
  }

  window.ART = { icon, dishSVG, packSVG, iconKey, chef, AVATARS };
})();

<script>
// 遊戲規則（簡化版）：沒有爐台、沒有扣分陷阱，料都在冰箱裡，點一下或拖一下就放進去
(function () {
  const D = window.DATA;
  const TOTAL = 180; // 一局 3 分鐘
  const BEST_KEY = "jjs-rush-best";

  const S = {
    running: false, t: 0, phase: 0,
    score: 0, revenue: 0, served: 0, missed: 0, mistakes: 0, taps: 0,
    slots: [], stations: {}, nextAt: [0, 0],
    lastIds: [], dishSeen: {}, uid: 0
  };
  window.S = S;
  window.GAME_TOTAL = TOTAL;

  function slotsFor(phase) { return D.PHASES[phase].slots; }
  function phaseAt(t) {
    for (let i = 0; i < D.PHASES.length; i++) if (t < D.PHASES[i].until) return i;
    return D.PHASES.length - 1;
  }

  function eligible(phase) {
    return D.DISHES.filter(d =>
      d.cat === "noodle" ||
      (d.cat === "side" && phase >= 1) ||
      ((d.cat === "soup" || d.cat === "dessert") && phase >= 2));
  }

  // 每道菜的時限都比較寬，讓人有時間看清楚
  const LIMIT = { noodle: 110, side: 85, soup: 85, dessert: 85 };

  function makeOrder() {
    const pool = eligible(S.phase);
    const fresh = pool.filter(d => !S.lastIds.slice(-3).includes(d.id));
    const list = fresh.length ? fresh : pool;
    const dish = list[Math.floor(Math.random() * list.length)];
    S.lastIds.push(dish.id);
    const first = !S.dishSeen[dish.id];
    S.dishSeen[dish.id] = true;
    const limit = LIMIT[dish.cat];
    return { id: ++S.uid, dish, left: limit, limit, mist: 0, first };
  }

  function emptySlot() { return { order: null, base: null, have: [] }; }

  function resetGame() {
    S.running = true; S.t = 0; S.phase = 0;
    S.score = 0; S.revenue = 0; S.served = 0; S.missed = 0; S.mistakes = 0; S.taps = 0;
    S.slots = [emptySlot(), emptySlot()];
    S.nextAt = [0.5, 1.5];
    S.lastIds = []; S.dishSeen = {}; S.uid = 0;
    fill();
  }

  // 有新客人入座就回傳 true
  function fill() {
    const n = slotsFor(S.phase);
    let added = false;
    for (let i = 0; i < n; i++) {
      const sl = S.slots[i];
      if (!sl.order && S.t >= S.nextAt[i]) {
        const o = makeOrder();
        // 有些菜本來就有底料（例如雨來菇），一入座就已經在盤子上
        S.slots[i] = { order: o, base: null, have: (o.dish.pre || []).slice() };
        added = true;
      }
    }
    return added;
  }

  // 判定：這個東西能不能放進第 i 格；回傳 null 代表可以，否則是提示文字
  function check(i, payload) {
    const sl = S.slots[i];
    if (!sl || !sl.order) return "這格還沒有客人";
    const dish = sl.order.dish;
    if (payload.kind === "base") {
      if (!dish.base) return "這道菜不用麵";
      if (sl.base) return "碗裡已經有麵了";
      if (payload.id !== dish.base) return "不是這碗的麵";
      return null;
    }
    const id = payload.id;
    if (sl.have.includes(id)) return "已經加過了";
    if (!dish.items.includes(id)) return id === "egg" ? "這碗沒有溏心蛋！" : "這道菜不加這個";
    if (dish.base && !sl.base) return "先放麵條";
    if (dish.ordered) {
      // 要照順序放：前面的料還沒放就不能放後面的
      const idx = dish.items.indexOf(id);
      for (let j = 0; j < idx; j++) {
        if (!sl.have.includes(dish.items[j])) return "先放" + D.ING[dish.items[j]].zh;
      }
    }
    return null;
  }

  function apply(i, payload) {
    const sl = S.slots[i];
    if (payload.kind === "base") sl.base = payload.id;
    else sl.have.push(payload.id);
  }

  function complete(sl) {
    if (!sl.order) return false;
    const d = sl.order.dish;
    if (d.base && !sl.base) return false;
    return d.items.every(x => sl.have.includes(x));
  }

  // 放錯只提示，不扣分，只記錄次數
  function wrong(i, msg) {
    S.mistakes++;
    const o = S.slots[i] && S.slots[i].order;
    if (o) o.mist++;
    return { ok: false, msg };
  }

  // 拖到第 i 格
  function dropOnSlot(i, payload) {
    S.taps++;
    const why = check(i, payload);
    if (why) return wrong(i, why);
    apply(i, payload);
    return { ok: true, msg: complete(S.slots[i]) ? "可以出餐了！" : "" };
  }

  // 點一下：自動放到第一個需要這個料的客人那裡
  function tapAdd(payload) {
    S.taps++;
    const n = slotsFor(S.phase);
    let first = null;
    for (let i = 0; i < n; i++) {
      const why = check(i, payload);
      if (!why) {
        apply(i, payload);
        return { ok: true, msg: complete(S.slots[i]) ? "可以出餐了！" : "", slot: i };
      }
      if (first === null) first = why;
    }
    return wrong(0, first || "現在沒有客人要這個");
  }

  function serve(i) {
    const sl = S.slots[i];
    if (!complete(sl)) return null;
    const o = sl.order;
    const perfect = o.mist === 0;
    const speed = Math.round(60 * Math.max(0, o.left) / o.limit);
    const pts = 100 + speed + (perfect ? 30 : 0);
    S.score += pts;
    S.revenue += o.dish.price;
    S.served++;
    S.slots[i] = emptySlot();
    S.nextAt[i] = S.t + 1.5;
    return { pts, perfect };
  }

  function fail(i) {
    S.missed++;
    S.slots[i] = emptySlot();
    S.nextAt[i] = S.t + 2;
  }

  // 每一幀更新：回傳事件讓介面顯示提示
  function tick(dt) {
    const events = [];
    if (!S.running) return events;
    S.t += dt;
    const ph = phaseAt(S.t);
    if (ph !== S.phase) { S.phase = ph; events.push({ type: "phase", ph }); }

    const n = slotsFor(S.phase);
    for (let i = 0; i < n; i++) {
      const sl = S.slots[i];
      if (!sl.order) continue;
      sl.order.left -= dt;
      if (sl.order.left <= 0) { fail(i); events.push({ type: "fail", i }); }
    }

    if (fill()) events.push({ type: "new" });
    if (S.t >= TOTAL) { S.running = false; events.push({ type: "end" }); }
    return events;
  }

  // 目前最該做的一步
  function hint() {
    const n = slotsFor(S.phase);
    for (let i = 0; i < n; i++) {
      const sl = S.slots[i];
      if (!sl.order) continue;
      const d = sl.order.dish;
      if (d.base && !sl.base) return "先點「" + D.BASES[d.base].zh + "」，麵會放進碗裡";
      const miss = d.items.find(x => !sl.have.includes(x));
      if (!miss) return "料都齊了，按「出餐」送出";
      return "點「" + D.ING[miss].zh + "」，會放進" + containerName(d) + "裡";
    }
    return "等客人入座…";
  }

  function containerName(d) {
    return d.cat === "noodle" ? "碗" : d.cat === "soup" ? "湯碗" : d.cat === "dessert" ? "杯子" : "盤子";
  }

  function rank(score) { return score >= 1500 ? 3 : score >= 900 ? 2 : score >= 400 ? 1 : 0; }
  function getBest() { try { return +localStorage.getItem(BEST_KEY) || 0; } catch (e) { return 0; } }
  function setBest(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { } }

  window.LOGIC = {
    resetGame, tick, check, dropOnSlot, tapAdd, serve, hint,
    complete, rank, getBest, setBest, slotsFor, eligible
  };
})();
</script>
<script>
// 介面：選廚師、畫面切換、拖曳與點擊、炙燒動畫、廚師工作區、音效與動畫迴圈
(function () {
  const D = window.DATA, A = window.ART, L = window.LOGIC, S = window.S, TOTAL = window.GAME_TOTAL;
  const AV = A.AVATARS;
  const app = document.getElementById("app");
  const RANKS = ["洗碗小幫手", "實習廚師", "二廚", "主廚認證"];
  let raf = 0, last = 0, activeTab = D.TABS[0].key, audio = null, pend = null, ghost = null, groupOf = {};
  let avatar = 0, pickTimer = 0, busy = false;
  let wk = { mode: "idle", until: 0 }, wkKey = "";
  try { avatar = +localStorage.getItem("jjs-avatar") || 0; } catch (e) { avatar = 0; }
  if (!(avatar >= 0 && avatar < AV.length)) avatar = 0;

  // 每個食材屬於哪一個冰箱分頁
  D.TABS.forEach(t => t.ids.forEach(id => { groupOf[id] = t.key; }));

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function mmss(sec) { const s = Math.ceil(sec), m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  // 音效（需要點擊後才會播）
  function tone(f, dur, type, vol, delay) {
    if (!audio) return;
    const t = audio.currentTime + (delay || 0), o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
  }
  const sfx = {
    tap: () => tone(660, 0.07, "triangle", 0.12),
    ding: () => { tone(1318, 0.5, "sine", 0.25); tone(1760, 0.6, "sine", 0.18, 0.09); },
    buzz: () => tone(150, 0.18, "square", 0.07),
    ready: () => tone(988, 0.2, "sine", 0.15),
    sizzle: () => [0, 0.08, 0.16, 0.24, 0.32].forEach((d, i) => tone(180 + (i % 2) * 40, 0.12, "sawtooth", 0.03, d)),
    end: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.4, "sine", 0.18, i * 0.12))
  };

  function toast(text, ok) {
    const t = document.getElementById("toast");

    t.textContent = text;
    t.className = "toast show" + (ok ? " ok" : "");

    toast._t = setTimeout(() => { t.className = "toast"; }, 1300);
  }

  // ---------- 開始畫面 ----------
  function startScreen() {

    const best = L.getBest();
    app.innerHTML = `<div class="intro">
      <div class="brand">久時拌麵</div>
      <h1>拌麵出餐挑戰</h1>
      <p>三分鐘一班，客人一位一位來。照單把麵和配料湊齊，按「出餐」送出，越快越好。</p>
      <ol class="howto">
        <li><b>1</b><span>從「麵櫃」點一下麵，或拖到客人的碗上</span></li>
        <li><b>2</b><span>從「冰箱」點一下配料，會自動放進客人的碗或盤</span></li>
        <li><b>3</b><span>料都到齊，按「出餐」送出</span></li>
      </ol>
      <button class="primary" id="go">開　始</button>
      <div class="best">${best ? "最高分 " + best.toLocaleString() : ""}</div>
    </div>`;
    document.getElementById("go").onclick = chooseScreen;
  }

  // ---------- 選廚師 ----------
  function chooseScreen() {
    cancelAnimationFrame(raf); stopPick();
    app.innerHTML = `<div class="choose">
      <div class="brand">久時拌麵</div>
      <h2>選一位廚師</h2>
      <p class="sub">他會在畫面下方替你忙</p>
      <div class="avs">${AV.map((a, i) => `<button class="av${i === avatar ? " on" : ""}" data-av="${i}"><span class="avbox" data-avbox="${i}">${A.chef(i, 0)}</span><span class="avname">${esc(a.name)}</span></button>`).join("")}</div>
      <button class="primary" id="ok">就是他</button>
      <button class="ghostbtn" id="back">回首頁</button>
    </div>`;
    let f = 0;
    pickTimer = setInterval(() => {
      f ^= 1;
      document.querySelectorAll("[data-avbox]").forEach(el => { el.innerHTML = A.chef(+el.dataset.avbox, f); });
    }, 450);
    app.querySelectorAll("[data-av]").forEach(b => {
      b.onclick = () => {
        avatar = +b.dataset.av;
        try { localStorage.setItem("jjs-avatar", String(avatar)); } catch (e) { }
        app.querySelectorAll("[data-av]").forEach(x => x.classList.toggle("on", x === b));
      };
    });
    document.getElementById("ok").onclick = startGame;
    document.getElementById("back").onclick = startScreen;
  }

  // ---------- 遊戲畫面 ----------
  function startGame() {
    stopPick();
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.resume) audio.resume(); } catch (e) { audio = null; }
    L.resetGame();
    busy = false;
    activeTab = D.TABS[0].key;
    wk = { mode: "idle", until: 0 }; wkKey = "";
    app.innerHTML = `
      <div class="hud">
        <div><div class="lbl">分數</div><div class="val" id="hs">0</div></div>

      </div>
      <div class="stagebar"><span id="stage"></span></div>
      <div class="tip" id="tip"></div>
      <div class="pass" id="pass"></div>
      <div class="kitchen">
        <div class="row-title"><span>麵櫃</span><span>點一下或拖到碗上</span></div>
        <div class="noodles" id="noodles"></div>
        <div class="row-title"><span>冰箱</span><span>點一下就放進客人的碗</span></div>
        <div class="tabs" id="tabs"></div>
        <div class="fridge" id="fridge"></div>
      </div>
      <div class="worker"><div class="wkav" id="wkav"></div><div class="wkbub" id="wksay">歡迎光臨！</div></div>
      <div class="toast" id="toast"></div>`;
    document.getElementById("noodles").innerHTML = Object.keys(D.BASES).map(k =>
      `<div class="pack" data-src='${JSON.stringify({ kind: "base", id: k })}'>${A.packSVG(k)}<span>${esc(D.BASES[k].zh)}</span></div>`
    ).join("");
    renderAll();
    setWorker("idle", "歡迎光臨！", 1500);
    last = performance.now();
    raf = requestAnimationFrame(loop);
  }

  function renderAll() {
    renderHUD();
    renderPass();
    renderTabs();
    renderFridge();
    document.getElementById("tip").textContent = L.hint();
  }

  function renderHUD() {
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    set("hs", S.score.toLocaleString());
    set("hr", "$" + S.revenue.toLocaleString());
    set("stage", D.PHASES[S.phase].label.zh);
    set("ht", mmss(Math.max(0, TOTAL - S.t)));
    const hc = document.getElementById("hc");
    if (hc) hc.classList.toggle("low", TOTAL - S.t <= 20);
  }

  function renderPass() {
    const pass = document.getElementById("pass");
    const n = L.slotsFor(S.phase);
    pass.className = "pass" + (n === 1 ? " one" : "");
    let html = "";
    for (let i = 0; i < n; i++) html += slotHTML(i);
    pass.innerHTML = html;
  }

  function slotHTML(i) {
    const sl = S.slots[i];
    if (!sl.order) {
      return `<div class="slot empty">
        <div class="ticket"><span>桌 ${i + 1}</span><span></span></div>
        <div class="name">等待入座</div>
        <div style="flex:1;display:grid;place-items:center;color:var(--soft);font-size:14px;min-height:120px">下一位客人馬上來</div>
      </div>`;
    }
    const o = sl.order, d = o.dish, done = L.complete(sl);
    const broth = d.cat === "soup" ? (d.items[0] === "broth1" ? "#dcaa4a" : "#efe3b5") : null;
    const chips = [];
    if (d.base) chips.push({ label: D.BASES[d.base].zh, ok: !!sl.base });
    d.items.forEach(x => chips.push({ label: D.ING[x].zh, ok: sl.have.includes(x) }));
    const chipHTML = chips.map(c => `<span class="chip${c.ok ? " ok" : ""}">${esc(c.label)}</span>`).join("");
    return `<div class="slot${done ? " ready" : ""}" data-drop="slot:${i}">
      <div class="ticket"><span>桌 ${i + 1}</span><span>$${d.price}</span></div>
      <div class="name">${d.no ? d.no + " " : ""}${esc(d.zh)}</div>

      <div class="bar${o.left / o.limit < 0.3 ? " warn" : ""}"><i data-bar="slot${i}"></i></div>

    </div>`;

  function renderTabs() {
    const tabs = document.getElementById("tabs");
    const needed = new Set(), needIds = new Set();
    const n = L.slotsFor(S.phase);
    for (let i = 0; i < n; i++) {
      const sl = S.slots[i];
      if (!sl.order) continue;
      sl.order.dish.items.forEach(x => { if (!sl.have.includes(x)) { needed.add(groupOf[x]); needIds.add(x); } });
    }
    // 目前分類沒有客人要的料時，自動切到有需要的分類
    const cur = D.TABS.find(t => t.key === activeTab);
    if (!(cur && cur.ids.some(x => needIds.has(x)))) {
      const next = D.TABS.find(t => S.phase >= t.phase && t.ids.some(x => needIds.has(x)));
      if (next) activeTab = next.key;
    }
    tabs.innerHTML = D.TABS.map(t => {
      const open = S.phase >= t.phase;
      const cls = ["tab", open ? "" : "locked", open && needed.has(t.key) ? "need" : ""].join(" ");
      return `<button class="${cls}" data-tab="${t.key}" aria-pressed="${activeTab === t.key}" ${open ? "" : "disabled"}>${t.zh}</button>`;
    }).join("");
  }

  function renderFridge() {
    const box = document.getElementById("fridge");
    const ids = (D.TABS.find(t => t.key === activeTab) || D.TABS[0]).ids;
    box.innerHTML = ids.map(id => {
      const ing = D.ING[id];

    }).join("");
  }

  // ---------- 廚師工作區 ----------
  // mode：idle 站著等、cook 攪拌或翻面、serve 舉手歡呼
  function setWorker(mode, say, ms) {
    wk = { mode, until: performance.now() + (ms || 0) };
    const el = document.getElementById("wksay");
    if (el) el.textContent = say;
    wkKey = "";
  }

  function updateWorker(now) {
    if (wk.mode !== "idle" && wk.until && now > wk.until) setWorker("idle", "準備好了！", 0);
    const period = wk.mode === "cook" ? 180 : wk.mode === "serve" ? 260 : 900;
    const f = Math.floor(now / period) % 2;
    const pose = wk.mode === "cook" ? (f ? 1 : 0) : wk.mode === "serve" ? (f ? 2 : 0) : 0;
    const key = wk.mode + pose;
    if (key === wkKey) return;
    wkKey = key;
    const box = document.getElementById("wkav");
    if (box) box.innerHTML = A.chef(avatar, pose);
  }

  // ---------- 炙燒與油封：先顯示火焰，再把料放進去 ----------
  function fx(x, y, kind) {
    const el = document.createElement("div");
    el.className = "fx " + kind;
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.innerHTML = "<i></i><i></i><i></i>";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 600);
  }

  function isCook(p) { return p.kind === "ing" && !!D.ING[p.id].cook; }

  function cookThen(p, x, y, go) {
    if (busy) { sfx.buzz(); toast("廚師正在忙，等一下"); return; }
    busy = true;
    const ing = D.ING[p.id];
    setWorker("cook", ing.cook + ing.zh + "中…", 500);
    sfx.sizzle();
    fx(x, y, ing.cook === "蒸烤" ? "steam" : "smoke");
    setTimeout(() => {
      busy = false;
      if (!S.running) return;
      go();
      if (wk.mode === "cook") setWorker("idle", ing.zh + "好了！", 900);
    }, 500);
  }

  function slotFor(p) {
    const n = L.slotsFor(S.phase);
    for (let i = 0; i < n; i++) if (!L.check(i, normalize(p))) return i;
    return -1;
  }

  // ---------- 拖曳與點擊 ----------
  // iPhone 的網址列會改變可視高度，這裡用實際高度來排版
  function setVH() { document.documentElement.style.setProperty("--vh", (window.innerHeight * 0.01) + "px"); }
  setVH();
  window.addEventListener("resize", setVH);

  function startDrag(p) {
    ghost = document.createElement("div");
    ghost.className = "ghost";
    const label = p.kind === "base" ? D.BASES[p.id].zh : D.ING[p.id].zh;
    const art = p.kind === "base" ? A.packSVG(p.id).replace('width="40"', 'width="52"') : A.icon(p.id, 52);
    ghost.innerHTML = art + `<span>${esc(label)}</span>`;
    document.body.appendChild(ghost);
  }

  function moveGhost(x, y) {
    if (!ghost) return;
    ghost.style.left = x + "px";
    ghost.style.top = y + "px";
  }

  function targetAt(x, y) {
    const el = document.elementFromPoint(x, y);
    const t = el && el.closest("[data-drop]");
    document.querySelectorAll(".over").forEach(n => { if (n !== t) n.classList.remove("over"); });
    if (t) t.classList.add("over");
    return t ? t.dataset.drop : null;
  }

  function endDrag() {
    if (ghost) ghost.remove();
    ghost = null;
    document.querySelectorAll(".over").forEach(n => n.classList.remove("over"));
  }

  function normalize(p) {
    return p.kind === "base" ? { kind: "base", id: p.id } : { kind: "ing", id: p.id };
  }

  function handleDrop(p, target, x, y) {
    const [kind, key] = target.split(":");
    if (kind !== "slot") return;
    const i = +key;
    const go = () => {
      const r = L.dropOnSlot(i, normalize(p));
      if (r.ok) {
        sfx.tap();
        if (r.msg) toast(r.msg, true);
        if (L.complete(S.slots[i])) sfx.ready();
      } else {
        sfx.buzz();
        toast(r.msg);
        const el = document.querySelectorAll("#pass .slot")[i];
        if (el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
      }
      renderAll();
    };
    if (isCook(p) && !L.check(i, normalize(p))) return cookThen(p, x, y, go);
    go();
  }

  function handleTap(p, x, y) {
    const go = () => {
      const r = L.tapAdd(normalize(p));
      if (r.ok) { sfx.tap(); if (r.msg) toast(r.msg, true); }
      else { sfx.buzz(); toast(r.msg); }
      renderAll();
    };
    if (isCook(p)) {
      if (slotFor(p) < 0) return go(); // 沒有客人要這個，直接顯示提示
      return cookThen(p, x, y, go);
    }
    go();
  }

  document.addEventListener("pointerdown", e => {
    const el = e.target.closest("[data-src]");
    if (!el || !S.running) return;
    pend = { p: JSON.parse(el.dataset.src), x: e.clientX, y: e.clientY, dragging: false };
  });
  window.addEventListener("pointermove", e => {
    if (!pend) return;
    if (!pend.dragging) {
      if (Math.hypot(e.clientX - pend.x, e.clientY - pend.y) < 8) return;
      pend.dragging = true;
      startDrag(pend.p);
    }
    moveGhost(e.clientX, e.clientY);
    targetAt(e.clientX, e.clientY);
  });
  window.addEventListener("pointerup", e => {
    if (!pend) return;
    const p = pend.p, wasDrag = pend.dragging;
    pend = null;
    if (wasDrag) {
      const t = targetAt(e.clientX, e.clientY);
      endDrag();
      if (t) handleDrop(p, t, e.clientX, e.clientY);
    } else {
      handleTap(p, e.clientX, e.clientY);
    }
  });
  window.addEventListener("pointercancel", () => { pend = null; endDrag(); });

  document.addEventListener("click", e => {
    const serveBtn = e.target.closest("[data-serve]");
    if (serveBtn && !serveBtn.disabled) {
      const i = +serveBtn.dataset.serve;
      const res = L.serve(i);
      if (res) {
        sfx.ding();
        setWorker("serve", res.perfect ? "完美！客人很滿意" : "出餐囉！", 900);
        toast(res.perfect ? "完美出餐！" : "出餐！", true);
        renderAll();
        const pass = document.querySelectorAll("#pass .slot")[i];
        if (pass) {
          const f = document.createElement("div");
          f.className = "float";
          f.textContent = "+" + res.pts;
          pass.appendChild(f);
        }
      }
      return;
    }
    const tab = e.target.closest("[data-tab]");
    if (tab && !tab.disabled) { activeTab = tab.dataset.tab; renderAll(); }
  });

  // ---------- 主迴圈 ----------
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    const events = L.tick(dt);
    let finished = false;
    events.forEach(ev => {
      if (ev.type === "phase") { toast(D.PHASES[ev.ph].label.zh, true); sfx.ding(); setWorker("idle", "新的時段開始！", 1500); }
      if (ev.type === "new") setWorker("idle", "歡迎光臨！", 1200);
      if (ev.type === "fail") { toast("客人等太久走了"); sfx.buzz(); setWorker("idle", "客人走了…", 1500); }
      if (ev.type === "end") finished = true;
    });
    if (finished) return endGame();
    if (events.length) renderAll();
    updateFrame();
    updateWorker(now);
    raf = requestAnimationFrame(loop);
  }

  // 每一幀只更新進度條與時間，不重畫整個畫面
  function updateFrame() {
    const ht = document.getElementById("ht");
    if (ht) ht.textContent = mmss(Math.max(0, TOTAL - S.t));
    const n = L.slotsFor(S.phase);
    for (let i = 0; i < n; i++) {
      const o = S.slots[i].order;
      const el = document.querySelector(`[data-bar="slot${i}"]`);
      if (o && el) el.style.width = Math.max(0, (o.left / o.limit) * 100) + "%";
    }
  }

  // ---------- 結算 ----------
  function endGame() {
    cancelAnimationFrame(raf);
    endDrag();
    sfx.end();
    const s = S.score, rk = L.rank(s);
    const prev = L.getBest(), isBest = s > prev && s > 0;
    if (isBest) L.setBest(s);
    const acc = S.taps ? Math.round(((S.taps - S.mistakes) / S.taps) * 100) : 0;
    const star = on => `<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z" fill="${on ? "#c39638" : "none"}" stroke="${on ? "#c39638" : "#c3cbd8"}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
    app.innerHTML = `<div class="result">
      <div class="stars">${[1, 2, 3].map(i => star(rk >= i)).join("")}</div>
      <p class="rank">${RANKS[rk]}</p>
      <div class="big">${s.toLocaleString()}</div>
      ${isBest ? '<div class="newbest">新紀錄！</div>' : ""}
      <div class="stats">
        <div><b>${S.served}</b><span>出餐</span></div>
        <div><b>${S.missed}</b><span>客人走掉</span></div>
        <div><b>${acc}%</b><span>準確率</span></div>
      </div>
      <p style="margin:0;color:var(--soft);font-size:15px;line-height:1.6;max-width:320px">這一班你替久時賺進 $${S.revenue.toLocaleString()}。</p>
      <button class="primary" id="again">再玩一次</button>
      <button class="ghostbtn" id="home">回首頁</button>
    </div>`;
    document.getElementById("again").onclick = startGame;
    document.getElementById("home").onclick = startScreen;
  }

  startScreen();
})();
</script>
</body></html>
