<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>拌麵出餐挑戰 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#eef0ec; --card:#fbfbf8; --ink:#22304a; --soft:#5f6b80; --line:#c3cbd8;
  --brand:#405880; --deep:#2b3d60; --steel:#d9dee6; --steel-2:#c4ccd7;
  --good:#4d7a52; --bad:#b4523c; --gold:#c39638;
  --serif:"Noto Serif TC","Songti TC","PMingLiu",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
#app{height:100vh;height:100dvh;max-width:460px;margin:0 auto;display:flex;flex-direction:column;padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));gap:8px}

/* 開始畫面 */
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;padding:12px}
.intro h1{font-family:var(--serif);font-weight:900;font-size:clamp(30px,9vw,40px);letter-spacing:.12em;color:var(--deep);margin:0}
.intro .brand{font-family:var(--serif);letter-spacing:.4em;color:var(--brand);font-size:13px}
.intro p{margin:0;color:var(--soft);line-height:1.7;font-size:14px;max-width:320px}
.howto{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:8px;text-align:left;font-size:14px;max-width:320px;width:100%}
.howto li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.howto b{width:24px;height:24px;flex:none;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px}
.primary{background:var(--brand);color:#fff;font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.3em;padding:14px 0;width:min(100%,300px);border-radius:14px;box-shadow:0 4px 0 var(--deep)}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.seg{display:inline-flex;border:1.5px solid var(--brand);border-radius:999px;overflow:hidden}
.seg button{padding:6px 14px;font-size:13px;color:var(--brand)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.best{font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums;min-height:18px}

/* HUD */
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:end;font-variant-numeric:tabular-nums;padding:0 4px}
.hud .lbl{font-size:10.5px;letter-spacing:.14em;color:var(--soft)}
.hud .val{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--deep);line-height:1.1}
.hud .r{text-align:right}
.hud .clock.low .val{color:var(--bad)}
.stagebar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--soft);padding:0 4px;min-height:18px}
.stagebar .combo{color:var(--gold);font-weight:700}
.tip{background:var(--card);border:1px dashed var(--brand);border-radius:10px;padding:7px 10px;font-size:13px;color:var(--deep);text-align:center;min-height:34px;display:flex;align-items:center;justify-content:center}

/* 出餐台 */
.pass{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.pass.one{grid-template-columns:1fr}
.pass.one .slot{max-width:none}
.slot{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:stretch;min-width:0;transition:border-color .2s,box-shadow .2s}
.slot.over{border-color:var(--brand);box-shadow:0 0 0 3px rgba(64,88,128,.18)}
.slot.empty{opacity:.55;border-style:dashed}
.slot.ready{border-color:var(--good);box-shadow:0 0 0 3px rgba(77,122,82,.2)}
.slot svg.dish{width:100%;height:auto;display:block;max-height:128px;margin:0 auto}
.slot .ticket{font-size:12px;color:var(--soft);display:flex;justify-content:space-between;gap:6px;padding:0 2px}
.slot .name{font-family:var(--serif);font-weight:700;font-size:14px;color:var(--ink);line-height:1.3;padding:2px 2px 0;min-height:36px}
.slot .vip{color:#fff;background:var(--gold);border-radius:4px;padding:0 5px;font-size:11px;margin-left:4px}
.slot .recipe{display:flex;flex-wrap:wrap;gap:3px;padding:2px;min-height:22px}
.chip{font-size:11px;padding:1px 6px;border-radius:999px;border:1px dashed var(--line);color:var(--soft)}
.chip.ok{border-style:solid;border-color:var(--good);color:var(--good)}
.chip.ok::before{content:"✓ "}
.bar{height:5px;border-radius:5px;background:var(--steel);overflow:hidden;margin:4px 2px 0}
.bar i{display:block;height:100%;width:100%;background:var(--brand);transform-origin:left}
.bar.warn i{background:var(--bad)}
.serve{margin-top:6px;width:100%;padding:9px 0;border-radius:10px;background:var(--steel);color:var(--soft);font-family:var(--serif);font-weight:900;letter-spacing:.25em;font-size:15px;opacity:.6}
.slot.ready .serve{background:var(--good);color:#fff;opacity:1;animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.12)}}
.slot .msg{position:absolute;left:50%;top:44%;transform:translateX(-50%);background:var(--bad);color:#fff;font-size:13px;padding:4px 10px;border-radius:8px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:3}
.slot .msg.show{opacity:1}
.slot .msg.ok{background:var(--good)}
.slot.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.float{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-family:var(--serif);font-weight:900;font-size:26px;color:var(--deep);pointer-events:none;animation:rise .9s ease-out forwards;z-index:4;text-shadow:0 2px 0 var(--paper)}
@keyframes rise{to{transform:translate(-50%,-50px);opacity:0}}

/* 廚房區 */
.kitchen{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden;background:linear-gradient(#dfe4eb,#cfd6e0);border-radius:16px;padding:8px;border:1px solid var(--steel-2)}
.row-title{font-size:11px;letter-spacing:.14em;color:var(--soft);display:flex;justify-content:space-between;align-items:center}
.stations{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.station{background:linear-gradient(#e9edf3,#d6dce5);border:1px solid var(--steel-2);border-radius:12px;padding:5px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.06)}
.station.locked{opacity:.4}
.station.over{border-color:var(--brand);box-shadow:0 0 0 3px rgba(64,88,128,.2)}
.station .sname{font-size:12px;color:var(--deep);font-weight:700}
.station .burners{display:flex;gap:6px}
.burner{width:46px;height:46px;border-radius:50%;background:#b9c1cc;border:2px solid #9aa4b1;display:grid;place-items:center;position:relative;touch-action:none}
.burner.on{background:radial-gradient(circle,#fff3d6 0%,#f0b25a 70%);box-shadow:0 0 12px rgba(240,140,60,.5)}
.burner.ready{box-shadow:0 0 0 3px var(--good),0 0 14px rgba(77,122,82,.5)}
.burner svg{width:38px;height:38px;pointer-events:none}
.burner .prog{position:absolute;left:4px;right:4px;bottom:-7px;height:4px;border-radius:4px;background:var(--steel);overflow:hidden}
.burner .prog i{display:block;height:100%;background:var(--brand)}
.noodles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pack{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:none;min-width:0}
.pack svg{width:38px;height:38px;pointer-events:none}
.pack span{font-size:10px;line-height:1.2;text-align:center;color:var(--ink)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--brand);color:var(--brand);background:transparent;position:relative}
.tab[aria-pressed="true"]{background:var(--brand);color:#fff}
.tab.need::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--gold);border:1.5px solid #fff}
.tab.locked{opacity:.35}
.fridge{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;align-content:start;flex:1;min-height:0;overflow-y:auto}
.ing{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:3px 1px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:none;min-width:0}
.ing svg{width:26px;height:26px;pointer-events:none}
.ing span{font-size:9.5px;line-height:1.15;text-align:center;word-break:break-all}
.ing.dim{opacity:.4}
.ing .tag{font-size:9.5px;color:var(--gold);font-weight:700}
.trash{align-self:flex-end;font-size:12px;color:var(--soft);padding:4px 10px;border:1px dashed var(--soft);border-radius:8px}

/* 拖曳中的影子 */
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;transform:translate(-50%,-70%);opacity:.95;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25))}
.ghost svg{width:52px;height:52px;display:block}
.ghost span{display:block;font-size:11px;background:var(--deep);color:#fff;border-radius:6px;padding:1px 6px;margin-top:2px;white-space:nowrap;text-align:center}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--deep);color:#fff;font-size:14px;padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.toast.ok{background:var(--good)}
.ing,.pack,.burner,.tab,.station{-webkit-touch-callout:none}

/* 結算 */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.stars{display:flex;gap:6px}
.stars svg{width:36px;height:36px}
.rank{font-family:var(--serif);font-weight:900;font-size:30px;color:var(--deep);letter-spacing:.08em;margin:0}
.big{font-family:var(--serif);font-weight:900;font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:340px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0}
.stats div+div{border-left:1px dotted var(--line)}
.stats b{display:block;font-family:var(--serif);font-size:20px;font-variant-numeric:tabular-nums;color:var(--deep)}
.stats span{font-size:11px;color:var(--soft)}
.newbest{color:var(--gold);font-weight:700;font-size:13px;letter-spacing:.1em}
.ghostbtn{font-size:13px;color:var(--brand);border:1px solid var(--brand);border-radius:999px;padding:6px 18px}

[data-src]{cursor:grab}
[data-src]:active{cursor:grabbing}
.intro,.result{flex:1;min-height:0}

/* 手機較矮的螢幕：縮小出餐台與爐台，讓冰箱還看得到 */
@media (max-width:899px) and (max-height:740px){
  .slot svg.dish{max-height:92px}
  .slot .name{min-height:0;font-size:13px}
  .slot .recipe{min-height:0}
  .serve{margin-top:4px;padding:6px 0;font-size:13px}
  .station{min-height:70px;padding:3px 3px 4px}
  .burner{width:38px;height:38px}
  .burner svg{width:28px;height:28px}
  .tip{min-height:26px;padding:4px 8px;font-size:12px}
  .hud .val{font-size:17px}
  .kitchen{padding:6px;gap:4px}
  .pack svg{width:30px;height:30px}
  .ing svg{width:22px;height:22px}
}

/* 電腦版：左邊出餐台、右邊廚房，整個畫面不用捲動 */
@media (min-width:900px){
  #app{max-width:1200px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:auto auto auto minmax(0,1fr);gap:10px 22px;padding:18px 24px}
  .hud{grid-column:1/-1;grid-row:1}
  .stagebar{grid-column:1/-1;grid-row:2}
  .tip{grid-column:1/-1;grid-row:3}
  .intro,.result{grid-column:1/-1;grid-row:1/-1}
  .pass{grid-column:1;grid-row:4;grid-template-columns:1fr;min-height:0;overflow-y:auto;align-content:start;padding:2px}
  .pass.one{grid-template-columns:1fr}
  .slot svg.dish{max-height:240px}
  .kitchen{grid-column:2;grid-row:4;min-height:0;overflow:hidden;padding:12px;gap:10px}
  .station{min-height:112px}
  .burner{width:56px;height:56px}
  .burner svg{width:44px;height:44px}
  .fridge{grid-template-columns:repeat(8,1fr);gap:6px}
  .ing svg{width:34px;height:34px}
  .ing span{font-size:11px}
  .pack svg{width:44px;height:44px}
  .pack span{font-size:11.5px}
  .hud .val{font-size:26px}
  .slot .name{font-size:17px}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
// 畫面繪製：食材圖示、容器（碗／盤／玻璃杯）與麵條
(function () {
  const D = window.DATA, IC = window.IC;
  const f1 = v => (Math.round(v * 10) / 10).toString();

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function iconKey(id) {
    const ing = D.ING[id];
    return ing ? ing.icon : id;
  }

  function icon(id, size) {
    return `<svg viewBox="0 0 40 40" width="${size}" height="${size}" aria-hidden="true">${IC[iconKey(id)] || ""}</svg>`;
  }

  function place(key, x, y, s, rot) {
    return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${rot || 0}) scale(${s}) translate(-20 -20)">${IC[key] || ""}</g>`;
  }

  // 麵條：用一組彎曲的線條表現，依麵體形狀調整
  function noodles(baseKey, cx, cy, r, seed) {
    const b = D.BASES[baseKey];
    const rand = rng(seed);
    const n = b.wave === "straight" ? 16 : b.wave === "thin" ? 34 : 24;
    const amp = b.wave === "curly" ? 3.2 : b.wave === "ribbon" ? 4.5 : b.wave === "thin" ? 2 : 1.2;
    const w = b.wave === "ribbon" ? 6 : b.wave === "thin" ? 2.6 : 3.4;
    const dark = shade(b.color, -0.35);
    let under = "", over = "";
    for (let i = 0; i < n; i++) {
      const a = rand() * Math.PI * 2, d = Math.sqrt(rand()) * r;
      let x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d;
      let th = rand() * Math.PI * 2;
      const pts = [[x, y]];
      const len = b.wave === "straight" ? 52 : 30;
      for (let s = 1; s <= 10; s++) {
        th += (rand() - 0.5) * 0.9;
        x += Math.cos(th) * len / 10;
        y += Math.sin(th) * len / 10;
        const off = amp * Math.sin(s * 1.6 + i);
        pts.push([x - Math.sin(th) * off, y + Math.cos(th) * off]);
      }
      const d2 = "M" + pts.map(p => f1(p[0]) + " " + f1(p[1])).join(" L");
      under += `<path d="${d2}" stroke="${dark}" stroke-width="${f1(w + 1.4)}"/>`;
      over += `<path d="${d2}" stroke="${b.color}" stroke-width="${f1(w)}"/>`;
    }
    return `<g fill="none" stroke-linecap="round" stroke-linejoin="round">${under}${over}</g>`;
  }

  function shade(hex, p) {
    const n = parseInt(hex.slice(1), 16);
    const f = v => Math.max(0, Math.min(255, Math.round(p < 0 ? v * (1 + p) : v + (255 - v) * p)));
    return "#" + [n >> 16, n >> 8 & 255, n & 255].map(v => f(v).toString(16).padStart(2, "0")).join("");
  }

  // 依容器種類排放食材
  function arrangeRing(items, cx, cy, radius, s) {
    if (items.length === 0) return "";
    if (items.length === 1) return place(iconKey(items[0]), cx, cy, s * 1.15, 0);
    let out = "";
    items.forEach((id, i) => {
      const a = (i / items.length) * Math.PI * 2 - Math.PI / 2;
      out += place(iconKey(id), cx + Math.cos(a) * radius, cy + Math.sin(a) * radius, s, (i * 37) % 40 - 20);
    });
    return out;
  }

  function arrangeRow(items, cy, s) {
    const n = items.length;
    let out = "";
    items.forEach((id, i) => {
      const x = n === 1 ? 120 : 60 + (i * 120) / (n - 1);
      out += place(iconKey(id), x, cy + (i % 2 ? 6 : -6), s, (i * 23) % 30 - 15);
    });
    return out;
  }

  function bowlSVG(dish, have, base, broth) {
    const isSoup = dish.cat === "soup";
    const inner = isSoup ? broth : "#f5f1e7";
    let s = `<circle cx="120" cy="108" r="96" fill="rgba(34,48,74,.14)"/>`;
    s += `<circle cx="120" cy="100" r="96" fill="#2f3b52"/>`;
    s += `<circle cx="120" cy="100" r="86" fill="${shade("#2f3b52", 0.12)}"/>`;
    s += `<circle cx="120" cy="100" r="80" fill="${inner}"/>`;
    if (!isSoup) {
      s += `<defs><clipPath id="bowlclip"><circle cx="120" cy="100" r="74"/></clipPath></defs>`;
      if (base) s += `<g clip-path="url(#bowlclip)">${noodles(base, 120, 100, 58, dish.id.length * 97 + 11)}</g>`;
      else s += `<circle cx="120" cy="100" r="60" fill="none" stroke="#d8d1bf" stroke-width="2" stroke-dasharray="5 6"/>`;
    }
    if (isSoup) s += `<circle cx="120" cy="100" r="60" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3"/>`;
    s += arrangeRing(have, 120, 100, 44, 1.2);
    return s;
  }

  function plateSVG(dish, have) {
    let s = `<rect x="22" y="34" width="200" height="140" rx="16" fill="rgba(34,48,74,.14)"/>`;
    s += `<rect x="20" y="28" width="200" height="140" rx="16" fill="#d7d2c4"/>`;
    s += `<rect x="30" y="38" width="180" height="120" rx="12" fill="#ebe7dc"/>`;
    s += arrangeRow(have, 98, 1.25);
    return s;
  }

  function glassSVG(dish, have) {
    let s = `<path d="M62 22 L178 22 L166 186 Q164 196 152 196 L88 196 Q76 196 74 186 Z" fill="rgba(34,48,74,.14)" transform="translate(4 6)"/>`;
    s += `<path d="M62 22 L178 22 L166 186 Q164 196 152 196 L88 196 Q76 196 74 186 Z" fill="#e8f2f5" stroke="#8fb0bd" stroke-width="3"/>`;
    s += `<path d="M70 70 L170 70 L166 186 Q164 194 152 194 L88 194 Q76 194 74 186 Z" fill="#f7f1d9" opacity=".7"/>`;
    const pos = [[104, 62], [138, 62], [104, 116], [138, 116], [121, 160]];
    have.forEach((id, i) => { const p = pos[i] || pos[pos.length - 1]; s += place(iconKey(id), p[0], p[1], 1.05, 0); });
    return s;
  }

  // 公開：畫出一個出餐容器
  // dish: 菜色資料；have: 已加的食材；base: 已放的麵（只有麵才有）；broth: 湯底顏色
  function dishSVG(dish, have, base, broth) {
    let inner;
    if (dish.cat === "noodle" || dish.cat === "soup") inner = bowlSVG(dish, have, base, broth);
    else if (dish.cat === "dessert") inner = glassSVG(dish, have);
    else inner = plateSVG(dish, have);
    return `<svg class="dish" viewBox="0 0 240 210" role="img" aria-label="${dish.zh}">${inner}</svg>`;
  }

  // 麵條小圖示（麵櫃用）
  function packSVG(baseKey) {
    const b = D.BASES[baseKey];
    return `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#f3efe4" stroke="#c3cbd8"/><g clip-path="url(#pk${baseKey})"></g>${noodlesSmall(baseKey)}</svg>`;
  }
  function noodlesSmall(baseKey) {
    const b = D.BASES[baseKey];
    const dark = shade(b.color, -0.35);
    const rand = rng(baseKey.length * 31 + baseKey.charCodeAt(0));
    let under = "", over = "";
    for (let i = 0; i < 9; i++) {
      const a = rand() * 6.28, d = rand() * 12;
      const x = 20 + Math.cos(a) * d, y = 20 + Math.sin(a) * d;
      const x2 = x + 14 * Math.cos(a + 0.8), y2 = y + 14 * Math.sin(a + 0.8);
      const d2 = `M${f1(x)} ${f1(y)} Q${f1((x + x2) / 2 + 3)} ${f1((y + y2) / 2 - 3)} ${f1(x2)} ${f1(y2)}`;
      under += `<path d="${d2}" stroke="${dark}" stroke-width="3.6"/>`;
      over += `<path d="${d2}" stroke="${b.color}" stroke-width="2.2"/>`;
    }
    return `<g fill="none" stroke-linecap="round">${under}${over}</g>`;
  }

  window.ART = { icon, dishSVG, packSVG, iconKey };
})();
</script>
<script>
// 遊戲規則：狀態、點單、爐台、判定與結算
(function () {
  const D = window.DATA;
  const TOTAL = 180; // 一局 3 分鐘
  const BEST_KEY = "jjs-rush-best";

  const S = {
    running: false, t: 0, phase: 0,
    score: 0, revenue: 0, served: 0, missed: 0, mistakes: 0, taps: 0,
    combo: 0, bestCombo: 0,
    slots: [], stations: { wok: [], oven: [], stove: [] },
    nextAt: [0, 0], nextEvent: 0,
    lastIds: [], dishSeen: {}, uid: 0
  };
  window.S = S;
  window.GAME_TOTAL = TOTAL;

  function slotsFor(phase) { return D.PHASES[phase].slots; }
  function phaseAt(t) {
    for (let i = 0; i < D.PHASES.length; i++) if (t < D.PHASES[i].until) return i;
    return D.PHASES.length - 1;
  }
  function stationUnlocked(key) { return D.STATIONS[key].phase <= S.phase; }
  function stationFor(id) {
    const ing = D.ING[id];
    return ing && ing.station ? ing.station : null;
  }
  function stationOpenFor(id) {
    // 找一台能做這個、而且還有空位的爐台
    const keys = Object.keys(D.STATIONS);
    for (const k of keys) {
      if (!D.STATIONS[k].accepts.includes(id)) continue;
      if (!stationUnlocked(k)) continue;
      if (S.stations[k].length >= 2) continue;
      return k;
    }
    return null;
  }

  function eligible(phase) {
    return D.DISHES.filter(d =>
      d.cat === "noodle" ||
      (d.cat === "side" && phase >= 1) ||
      ((d.cat === "soup" || d.cat === "dessert") && phase >= 2));
  }

  function makeOrder() {
    const pool = eligible(S.phase);
    const fresh = pool.filter(d => !S.lastIds.slice(-3).includes(d.id));
    const dish = (fresh.length ? fresh : pool)[Math.floor(Math.random() * (fresh.length || pool.length))];
    const base = dish.cat === "noodle" ? 100 : dish.cat === "side" ? 58 : 62;
    const vip = S.phase >= 1 && Math.random() < 0.18;
    const limit = (vip ? base * 0.8 : base) + (S.phase === 0 ? 15 : 0);
    S.lastIds.push(dish.id);
    const first = !S.dishSeen[dish.id];
    S.dishSeen[dish.id] = true;
    return { id: ++S.uid, dish, left: limit, limit, vip, mist: 0, first };
  }

  function emptySlot() { return { order: null, base: null, have: [] }; }

  function resetGame() {
    S.running = true; S.t = 0; S.phase = 0;
    S.score = 0; S.revenue = 0; S.served = 0; S.missed = 0; S.mistakes = 0; S.taps = 0;
    S.combo = 0; S.bestCombo = 0;
    S.slots = [emptySlot(), emptySlot()];
    S.stations = { wok: [], oven: [], stove: [] };
    S.nextAt = [0.8, 2.5]; S.nextEvent = 30;
    S.lastIds = []; S.dishSeen = {}; S.uid = 0;
    fill();
  }

  function fill() {
    const n = slotsFor(S.phase);
    for (let i = 0; i < n; i++) {
      const sl = S.slots[i];
      if (!sl.order && S.t >= S.nextAt[i]) {
        const o = makeOrder();
        S.slots[i] = { order: o, base: null, have: [] };
        if (o.first && o.dish.cat !== "noodle") { /* 新菜：介面會顯示做法 */ }
      }
    }
  }

  function burnTime() { return S.phase === 0 ? 14 : 10; }

  // 判定：這個東西能不能放進第 i 格；回傳 null 代表可以，否則是提示文字
  function check(i, payload) {
    const sl = S.slots[i];
    if (!sl || !sl.order) return "這格沒有客人";
    const dish = sl.order.dish;
    if (payload.kind === "base") {
      if (!dish.base) return "這道菜不用麵";
      if (sl.base) return "碗裡已經有麵了";
      if (payload.id !== dish.base) return "不是這碗的麵";
      return null;
    }
    const id = payload.id;
    if (payload.from === "fridge" && D.ING[id].station) return "先拿到" + D.STATIONS[D.ING[id].station].zh + "處理";
    if (!dish.items.includes(id)) return id === "egg" ? "這碗沒有溏心蛋！" : "這道菜不加這個";
    if (dish.base && !sl.base) return "先放麵條";
    if (sl.have.includes(id)) return "已經加過了";
    if (dish.ordered && dish.items[sl.have.length] !== id) return "順序不對喔";
    return null;
  }

  function apply(i, payload) {
    const sl = S.slots[i];
    if (payload.kind === "base") sl.base = payload.id;
    else sl.have.push(payload.id);
  }

  function complete(sl) {
    if (!sl.order) return false;
    const d = sl.order.dish;
    if (d.base && !sl.base) return false;
    return d.items.every(x => sl.have.includes(x));
  }

  function wrong(i, msg) {
    S.mistakes++;
    S.combo = 0;
    const o = S.slots[i] && S.slots[i].order;
    if (o) o.mist++;
    if (S.phase > 0) S.score = Math.max(0, S.score - 5);
    return { ok: false, msg };
  }

  // 放到出餐格
  function dropOnSlot(i, payload) {
    S.taps++;
    const why = check(i, payload);
    if (why) return wrong(i, why);
    apply(i, payload);
    return { ok: true, msg: complete(S.slots[i]) ? "可以出餐了！" : "" };
  }

  // 點一下：自動找能放的地方
  function tapAdd(payload) {
    S.taps++;
    const n = slotsFor(S.phase);
    if (payload.from === "fridge" && D.ING[payload.id] && D.ING[payload.id].station) {
      const k = stationOpenFor(payload.id);
      if (k) return { ok: true, msg: "", cook: k };
      return wrong(0, "爐台滿了或還沒開");
    }
    let first = null;
    for (let i = 0; i < n; i++) {
      const why = check(i, payload);
      if (!why) { apply(i, payload); return { ok: true, msg: complete(S.slots[i]) ? "可以出餐了！" : "", slot: i }; }
      if (first === null) first = why;
    }
    return wrong(0, first || "沒有合適的客人");
  }

  // 把生食材放上爐台
  function cookAt(key, id) {
    S.taps++;
    if (!stationUnlocked(key)) return { ok: false, msg: "還沒開放" };
    if (!D.STATIONS[key].accepts.includes(id)) return wrong(0, "這台爐不做這個");
    if (S.stations[key].length >= 2) return { ok: false, msg: "爐台滿了，等一下" };
    S.stations[key].push({ id, start: S.t, ready: false, readyAt: 0 });
    return { ok: true, msg: "" };
  }

  function serve(i) {
    const sl = S.slots[i];
    if (!complete(sl)) return null;
    const o = sl.order;
    const perfect = o.mist === 0;
    const speed = Math.round(40 * Math.max(0, o.left) / o.limit);
    let pts = 100 + speed;
    if (perfect) { S.combo++; pts += 30 + 10 * Math.min(S.combo, 5); }
    else S.combo = 0;
    S.bestCombo = Math.max(S.bestCombo, S.combo);
    if (o.vip) pts *= 2;
    S.score += pts;
    S.revenue += o.dish.price * (o.vip ? 2 : 1);
    S.served++;
    S.slots[i] = emptySlot();
    S.nextAt[i] = S.t + 0.9;
    return { pts, perfect, vip: o.vip };
  }

  function fail(i) {
    S.missed++;
    S.combo = 0;
    S.slots[i] = emptySlot();
    S.nextAt[i] = S.t + 1.2;
  }

  // 每一幀更新：回傳事件讓介面顯示提示
  function tick(dt) {
    const events = [];
    if (!S.running) return events;
    S.t += dt;
    const ph = phaseAt(S.t);
    if (ph !== S.phase) { S.phase = ph; events.push({ type: "phase", ph }); }

    // 爐台：做好、燒焦
    Object.keys(S.stations).forEach(k => {
      const st = D.STATIONS[k];
      S.stations[k] = S.stations[k].filter(it => {
        if (!it.ready && S.t >= it.start + st.time) { it.ready = true; it.readyAt = S.t; events.push({ type: "ready", id: it.id }); }
        if (it.ready && S.t >= it.readyAt + burnTime()) {
          events.push({ type: "burn", id: it.id });
          if (S.phase > 0) S.score = Math.max(0, S.score - 5);
          return false;
        }
        return true;
      });
    });

    // 客人等待
    const n = slotsFor(S.phase);
    for (let i = 0; i < n; i++) {
      const sl = S.slots[i];
      if (!sl.order) continue;
      sl.order.left -= dt;
      if (sl.order.left <= 0) { fail(i); events.push({ type: "fail", i }); }
    }

    // 催單事件
    if (S.phase >= 1 && S.t >= S.nextEvent) {
      S.nextEvent = S.t + 24 + Math.random() * 10;
      const act = [];
      for (let i = 0; i < n; i++) if (S.slots[i].order) act.push(i);
      if (act.length) {
        const i = act[Math.floor(Math.random() * act.length)];
        S.slots[i].order.left -= 12;
        events.push({ type: "rush", i });
      }
    }

    fill();
    if (S.t >= TOTAL) { S.running = false; events.push({ type: "end" }); }
    return events;
  }

  function hint() {
    const n = slotsFor(S.phase);
    for (let i = 0; i < n; i++) {
      const sl = S.slots[i];
      if (!sl.order) continue;
      const d = sl.order.dish;
      if (d.base && !sl.base) return "先把「" + D.BASES[d.base].zh + "」拖到碗裡";
      let miss;
      if (d.ordered) miss = d.items[sl.have.length];
      else miss = d.items.find(x => !sl.have.includes(x));
      if (!miss) return "按「出餐」送出";
      const st = stationFor(miss);
      if (st) return "把「" + D.ING[miss].zh + "」放到" + D.STATIONS[st].zh + "，做好再拖過來";
      return "從冰箱拿「" + D.ING[miss].zh + "」放到" + (d.cat === "noodle" ? "碗" : d.cat === "soup" ? "湯碗" : d.cat === "dessert" ? "杯子" : "盤子") + "裡";
    }
    return "等客人入座…";
  }

  function rank(score) { return score >= 1500 ? 3 : score >= 900 ? 2 : score >= 400 ? 1 : 0; }
  function getBest() { try { return +localStorage.getItem(BEST_KEY) || 0; } catch (e) { return 0; } }
  function setBest(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { } }

  window.LOGIC = {
    resetGame, tick, check, dropOnSlot, tapAdd, cookAt, serve, hint,
    complete, stationUnlocked, stationOpenFor, rank, getBest, setBest,
    slotsFor, stationFor, eligible
  };
})();
</script>
<script>
// 介面：畫面切換、拖曳與點擊、音效與動畫迴圈
(function () {
  const D = window.DATA, A = window.ART, L = window.LOGIC, S = window.S, TOTAL = window.GAME_TOTAL;
  const app = document.getElementById("app");
  const RANKS = ["洗碗小幫手", "實習廚師", "二廚", "主廚認證"];
  let raf = 0, last = 0, activeTab = "main", audio = null, pend = null, ghost = null, groupOf = {};

  // 每個食材屬於哪一個冰箱分頁（第一次出現的菜色決定）
  const TAB_FOR_CAT = { noodle: "main", side: "side", soup: "soup", dessert: "dessert" };
  D.DISHES.forEach(d => d.items.forEach(id => { if (!(id in groupOf)) groupOf[id] = TAB_FOR_CAT[d.cat]; }));

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function mmss(sec) { const s = Math.ceil(sec), m = Math.floor(s / 60), r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

  // 音效（需要點擊後才會播）
  function tone(f, dur, type, vol, delay) {
    if (!audio) return;
    const t = audio.currentTime + (delay || 0), o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
  }
  const sfx = {
    tap: () => tone(660, 0.07, "triangle", 0.12),
    ding: () => { tone(1318, 0.5, "sine", 0.25); tone(1760, 0.6, "sine", 0.18, 0.09); },
    buzz: () => tone(150, 0.18, "square", 0.07),
    ready: () => tone(988, 0.2, "sine", 0.15),
    end: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.4, "sine", 0.18, i * 0.12))
  };

  function toast(text, ok) {
    const t = document.getElementById("toast");
    if (!t) return;
    t.textContent = text;
    t.className = "toast show" + (ok ? " ok" : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.className = "toast"; }, 1300);
  }

  // ---------- 開始畫面 ----------
  function startScreen() {
    cancelAnimationFrame(raf);
    const best = L.getBest();
    app.innerHTML = `<div class="intro">
      <div class="brand">久時拌麵</div>
      <h1>拌麵出餐挑戰</h1>
      <p>三分鐘一班，客人一張一張來。照單把麵、小菜和湯做好，出餐越快、越準，分數越高。</p>
      <ol class="howto">
        <li><b>1</b><span>從「麵櫃」拖一種麵到碗上，點一下也可以</span></li>
        <li><b>2</b><span>從「冰箱」拿料；要炒、要烤的先放到爐台，做好再拖過來</span></li>
        <li><b>3</b><span>料都到齊，按「出餐」送出</span></li>
      </ol>
      <button class="primary" id="go">開　始</button>
      <div class="best">${best ? "最高分 " + best.toLocaleString() : ""}</div>
    </div>`;
    document.getElementById("go").onclick = startGame;
  }

  // ---------- 遊戲畫面 ----------
  function startGame() {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); if (audio.resume) audio.resume(); } catch (e) { audio = null; }
    L.resetGame();
    activeTab = "main";
    app.innerHTML = `
      <div class="hud">
        <div><div class="lbl">分數</div><div class="val" id="hs">0</div></div>
        <div class="clock" id="hc"><div class="lbl">剩餘時間</div><div class="val" id="ht">3:00</div></div>
        <div class="r"><div class="lbl">營業額</div><div class="val" id="hr">$0</div></div>
      </div>
      <div class="stagebar"><span id="stage"></span><span class="combo" id="combo"></span></div>
      <div class="tip" id="tip"></div>
      <div class="pass" id="pass"></div>
      <div class="kitchen">
        <div class="row-title"><span>爐台</span><span>生食材拖上去，做好再拿</span></div>
        <div class="stations" id="stations"></div>
        <div class="row-title"><span>麵櫃</span><span>拖到碗上</span></div>
        <div class="noodles" id="noodles"></div>
        <div class="row-title"><span>冰箱</span></div>
        <div class="tabs" id="tabs"></div>
        <div class="fridge" id="fridge"></div>
      </div>
      <div class="toast" id="toast"></div>`;
    document.getElementById("noodles").innerHTML = Object.keys(D.BASES).map(k =>
      `<div class="pack" data-src='${JSON.stringify({ kind: "base", id: k })}'>${A.packSVG(k)}<span>${esc(D.BASES[k].zh)}</span></div>`
    ).join("");
    renderAll();
    last = performance.now();
    raf = requestAnimationFrame(loop);
  }

  function renderAll() {
    renderHUD();
    renderPass();
    renderStations();
    renderTabs();
    renderFridge();
    document.getElementById("tip").textContent = L.hint();
  }

  function renderHUD() {
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    set("hs", S.score.toLocaleString());
    set("hr", "$" + S.revenue.toLocaleString());
    set("stage", D.PHASES[S.phase].label.zh);
    set("combo", S.combo >= 2 ? "連續完美 ×" + S.combo : "");
    const hc = document.getElementById("hc");
    if (hc) hc.classList.toggle("low", TOTAL - S.t <= 20);
  }

  function renderPass() {
    const pass = document.getElementById("pass");
    const n = L.slotsFor(S.phase);
    pass.className = "pass" + (n === 1 ? " one" : "");
    let html = "";
    for (let i = 0; i < n; i++) html += slotHTML(i);
    pass.innerHTML = html;
  }

  function slotHTML(i) {
    const sl = S.slots[i];
    if (!sl.order) {
      return `<div class="slot empty" data-drop="slot:${i}">
        <div class="ticket"><span>桌 ${i + 1}</span><span></span></div>
        <div class="name">下一位客人準備中</div>
        <div style="flex:1;display:grid;place-items:center;color:var(--soft);font-size:12px;min-height:120px">等待入座</div>
      </div>`;
    }
    const o = sl.order, d = o.dish, done = L.complete(sl);
    const broth = d.cat === "soup" ? (d.items[0] === "broth1" ? "#dcaa4a" : "#efe3b5") : null;
    const chips = [];
    if (d.base) chips.push({ label: D.BASES[d.base].zh, ok: !!sl.base });
    d.items.forEach(x => chips.push({ label: D.ING[x].zh, ok: sl.have.includes(x) }));
    const showAll = o.first || S.phase === 0;
    const chipHTML = chips.map(c => {
      const txt = showAll || c.ok ? esc(c.label) : "？";
      return `<span class="chip${c.ok ? " ok" : ""}">${txt}</span>`;
    }).join("");
    return `<div class="slot${done ? " ready" : ""}" data-drop="slot:${i}">
      <div class="ticket"><span>桌 ${i + 1}${o.vip ? '<span class="vip">VIP ×2</span>' : ""}</span><span>$${d.price}</span></div>
      <div class="name">${d.no ? d.no + " " : ""}${esc(d.zh)}</div>
      <div class="recipe">${chipHTML}</div>
      ${A.dishSVG(d, sl.have, sl.base, broth)}
      <div class="bar${o.left / o.limit < 0.3 ? " warn" : ""}"><i data-bar="slot${i}"></i></div>
      <button class="serve" data-serve="${i}" ${done ? "" : "disabled"}>${done ? "出　餐" : "還沒齊"}</button>
    </div>`;
  }

  function renderStations() {
    const box = document.getElementById("stations");
    box.innerHTML = Object.keys(D.STATIONS).map(k => {
      const st = D.STATIONS[k], open = L.stationUnlocked(k);
      const burners = [0, 1].map(j => {
        const it = S.stations[k][j];
        if (!it) return `<div class="burner"></div>`;
        const ic = A.icon(it.id, 32);
        if (it.ready) {
          const src = esc(JSON.stringify({ kind: "ing", id: it.id, from: "station", station: k, idx: j }));
          return `<div class="burner ready" data-src='${src}'>${ic}</div>`;
        }
        return `<div class="burner on">${ic}<div class="prog"><i data-bar="st${k}${j}"></i></div></div>`;
      }).join("");
      return `<div class="station${open ? "" : " locked"}" data-drop="station:${k}">
        <div class="sname">${st.zh}${open ? "" : "（未開放）"}</div>
        <div class="burners">${burners}</div>
      </div>`;
    }).join("");
    // 站名前加上小圖示
    box.querySelectorAll(".sname").forEach((el, idx) => {
      const k = Object.keys(D.STATIONS)[idx];
      el.insertAdjacentHTML("beforebegin", A.icon(D.STATIONS[k].icon, 26));
    });
  }

  function renderTabs() {
    const tabs = document.getElementById("tabs");
    const needed = new Set();
    const n = L.slotsFor(S.phase);
    for (let i = 0; i < n; i++) {
      const sl = S.slots[i];
      if (!sl.order) continue;
      sl.order.dish.items.forEach(x => { if (!sl.have.includes(x)) needed.add(groupOf[x]); });
    }
    tabs.innerHTML = D.TABS.map(t => {
      const open = S.phase >= t.phase;
      const cls = ["tab", open ? "" : "locked", open && needed.has(t.key) ? "need" : ""].join(" ");
      return `<button class="${cls}" data-tab="${t.key}" aria-pressed="${activeTab === t.key}" ${open ? "" : "disabled"}>${t.zh}</button>`;
    }).join("");
  }

  function renderFridge() {
    const box = document.getElementById("fridge");
    const ids = Object.keys(D.ING).filter(id => groupOf[id] === activeTab);
    box.innerHTML = ids.map(id => {
      const ing = D.ING[id];
      const src = esc(JSON.stringify({ kind: "ing", id, from: "fridge" }));
      return `<div class="ing" data-src='${src}'>${A.icon(id, 30)}<span>${esc(ing.zh)}</span>${ing.station ? '<span class="tag">' + D.STATIONS[ing.station].zh + "</span>" : ""}</div>`;
    }).join("");
  }

  // 每一幀只更新進度條，不重畫整個畫面
  function updateFrame() {
    const ht = document.getElementById("ht");
    if (ht) ht.textContent = mmss(Math.max(0, TOTAL - S.t));
    const n = L.slotsFor(S.phase);
    for (let i = 0; i < n; i++) {
      const o = S.slots[i].order;
      const el = document.querySelector(`[data-bar="slot${i}"]`);
      if (o && el) el.style.width = Math.max(0, (o.left / o.limit) * 100) + "%";
    }
    Object.keys(S.stations).forEach(k => {
      S.stations[k].forEach((it, j) => {
        if (it.ready) return;
        const el = document.querySelector(`[data-bar="st${k}${j}"]`);
        if (el) el.style.width = Math.min(100, ((S.t - it.start) / D.STATIONS[k].time) * 100) + "%";
      });
    });
  }

  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    const events = L.tick(dt);
    let finished = false;
    events.forEach(ev => {
      if (ev.type === "phase") { toast(D.PHASES[ev.ph].label.zh, true); sfx.ding(); }
      if (ev.type === "ready") sfx.ready();
      if (ev.type === "burn") toast("爐火太久，焦了！");
      if (ev.type === "fail") { toast("客人等太久走了"); sfx.buzz(); }
      if (ev.type === "rush") toast("客人催單！");
      if (ev.type === "end") finished = true;
    });
    if (finished) return endGame();
    if (events.length) renderAll();
    updateFrame();
    raf = requestAnimationFrame(loop);
  }

  // ---------- 拖曳與點擊 ----------
  function startDrag(p) {
    ghost = document.createElement("div");
    ghost.className = "ghost";
    const label = p.kind === "base" ? D.BASES[p.id].zh : D.ING[p.id].zh;
    const art = p.kind === "base" ? A.packSVG(p.id).replace('width="40"', 'width="52"') : A.icon(p.id, 52);
    ghost.innerHTML = art + `<span>${esc(label)}</span>`;
    document.body.appendChild(ghost);
  }

  function moveGhost(x, y) {
    if (!ghost) return;
    ghost.style.left = x + "px";
    ghost.style.top = y + "px";
  }

  function targetAt(x, y) {
    const el = document.elementFromPoint(x, y);
    const t = el && el.closest("[data-drop]");
    document.querySelectorAll(".over").forEach(n => { if (n !== t) n.classList.remove("over"); });
    if (t) t.classList.add("over");
    return t ? t.dataset.drop : null;
  }

  function endDrag() {
    if (ghost) ghost.remove();
    ghost = null;
    document.querySelectorAll(".over").forEach(n => n.classList.remove("over"));
  }

  function normalize(p) {
    return p.kind === "base" ? { kind: "base", id: p.id } : { kind: "ing", id: p.id, from: p.from };
  }

  function takeFromStation(p) {
    const arr = S.stations[p.station];
    const idx = arr.findIndex(x => x.id === p.id && x.ready);
    if (idx >= 0) arr.splice(idx, 1);
  }

  function handleDrop(p, target) {
    const [kind, key] = target.split(":");
    if (kind === "slot") {
      const i = +key;
      const r = L.dropOnSlot(i, normalize(p));
      if (r.ok) {
        if (p.from === "station") takeFromStation(p);
        sfx.tap();
        if (r.msg) toast(r.msg, true);
        if (L.complete(S.slots[i])) sfx.ready();
      } else {
        sfx.buzz();
        toast(r.msg);
      }
      renderAll();
      if (!r.ok) { const el = document.querySelectorAll("#pass .slot")[i]; if (el) el.classList.add("shake"); }
      return;
    }
    if (kind === "station") {
      if (p.kind === "base") { toast("麵要拖到碗上，不是爐台"); return; }
      if (p.from === "station") { toast("這個已經在爐台上了"); return; }
      const r = L.cookAt(key, p.id);
      if (r.ok) { sfx.tap(); } else { sfx.buzz(); toast(r.msg); }
      renderAll();
    }
  }

  function handleTap(p) {
    let r;
    if (p.kind === "base") {
      r = L.tapAdd({ kind: "base", id: p.id });
    } else if (p.from === "fridge" && D.ING[p.id].station) {
      const k = L.stationOpenFor(p.id);
      if (!k) { toast("爐台都滿了或還沒開放"); return; }
      r = L.cookAt(k, p.id);
    } else {
      r = L.tapAdd({ kind: "ing", id: p.id, from: p.from });
      if (r.ok && p.from === "station") takeFromStation(p);
    }
    if (r.ok) { sfx.tap(); if (r.msg) toast(r.msg, true); }
    else { sfx.buzz(); toast(r.msg); }
    renderAll();
  }

  document.addEventListener("pointerdown", e => {
    const el = e.target.closest("[data-src]");
    if (!el || !S.running) return;
    pend = { p: JSON.parse(el.dataset.src), x: e.clientX, y: e.clientY, dragging: false };
  });
  window.addEventListener("pointermove", e => {
    if (!pend) return;
    if (!pend.dragging) {
      if (Math.hypot(e.clientX - pend.x, e.clientY - pend.y) < 8) return;
      pend.dragging = true;
      startDrag(pend.p);
    }
    moveGhost(e.clientX, e.clientY);
    targetAt(e.clientX, e.clientY);
  });
  window.addEventListener("pointerup", e => {
    if (!pend) return;
    const p = pend.p, wasDrag = pend.dragging;
    pend = null;
    if (wasDrag) {
      const t = targetAt(e.clientX, e.clientY);
      endDrag();
      if (t) handleDrop(p, t);
    } else {
      handleTap(p);
    }
  });
  window.addEventListener("pointercancel", () => { pend = null; endDrag(); });

  document.addEventListener("click", e => {
    const serveBtn = e.target.closest("[data-serve]");
    if (serveBtn && !serveBtn.disabled) {
      const i = +serveBtn.dataset.serve;
      const res = L.serve(i);
      if (res) {
        sfx.ding();
        toast(res.perfect ? "完美出餐！" : "出餐！", true);
        renderAll();
        const pass = document.querySelectorAll("#pass .slot")[i];
        if (pass) {
          const f = document.createElement("div");
          f.className = "float";
          f.textContent = "+" + res.pts;
          pass.appendChild(f);
        }
      }
      return;
    }
    const tab = e.target.closest("[data-tab]");
    if (tab && !tab.disabled) { activeTab = tab.dataset.tab; renderAll(); }
  });

  // ---------- 結算 ----------
  function endGame() {
    cancelAnimationFrame(raf);
    endDrag();
    sfx.end();
    const s = S.score, rk = L.rank(s);
    const prev = L.getBest(), isBest = s > prev && s > 0;
    if (isBest) L.setBest(s);
    const acc = S.taps ? Math.round(((S.taps - S.mistakes) / S.taps) * 100) : 0;
    const star = on => `<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z" fill="${on ? "#c39638" : "none"}" stroke="${on ? "#c39638" : "#c3cbd8"}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
    app.innerHTML = `<div class="result">
      <div class="stars">${[1, 2, 3].map(i => star(rk >= i)).join("")}</div>
      <p class="rank">${RANKS[rk]}</p>
      <div class="big">${s.toLocaleString()}</div>
      ${isBest ? '<div class="newbest">新紀錄！</div>' : ""}
      <div class="stats">
        <div><b>${S.served}</b><span>出餐</span></div>
        <div><b>${S.missed}</b><span>客人走掉</span></div>
        <div><b>${acc}%</b><span>準確率</span></div>
      </div>
      <p style="margin:0;color:var(--soft);font-size:13px;line-height:1.6;max-width:320px">這一班你替久時賺進 $${S.revenue.toLocaleString()}，最高連續完美 ×${S.bestCombo}。</p>
      <button class="primary" id="again">再玩一次</button>
      <button class="ghostbtn" id="home">回首頁</button>
    </div>`;
    document.getElementById("again").onclick = startGame;
    document.getElementById("home").onclick = startScreen;
  }

  startScreen();
})();
</script>
</body></html>
